# Fail2ban filter for Traefik authentication failures (401, 403).
# Goes in /etc/fail2ban/filter.d/.

[Definition]
failregex = ^{"time":".*","id":".*","RemoteAddr":"<HOST>","ClientUsername":".*","RequestMethod":".*","RequestUri":".*","RequestProtocol":".*","RequestHost":".*","RequestAddr":".*","RequestPort":".*","OriginDuration":".*","OriginContentSize":".*","OriginStatus":"(401|403)","OriginStatusLine":".*","RequestReferer":".*","RequestUserAgent":".*","RequestCount":".*","RouterName":".*","ServiceName":".*","ServiceAddr":".*","ServiceURL":".*","ClientAddr":".*","ClientHost":".*","ClientPort":".*","ClientUsername":".*","Duration":".*","ResponseCode":".*","RetryAttempts":".*","TLSVersion":".*","TLSCipher":".*","TLSServerName":".*","DownstreamContentSize":".*","DownstreamStatus":".*","DownstreamStatusLine":".*"}$

ignoreregex =
