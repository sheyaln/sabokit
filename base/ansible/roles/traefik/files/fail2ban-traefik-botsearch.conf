# Fail2ban filter matching common bot/scanner probes against Traefik
# (wp-admin, .env, phpmyadmin, etc.).
# Goes in /etc/fail2ban/filter.d/.

[Definition]
failregex = ^{"time":".*","id":".*","RemoteAddr":"<HOST>","ClientUsername":".*","RequestMethod":".*","RequestUri":".*/(wp-admin|wp-login|phpmyadmin|admin|administrator|xmlrpc\.php|wp-config\.php|\.env|\.git|\.htaccess|config\.php|install\.php|setup\.php|test\.php|debug\.php|shell\.php|c99\.php|r57\.php|webshell\.php|backdoor\.php|eval\.php|phpinfo\.php|info\.php|\.sql|\.bak|\.backup|\.old|\.orig|\.tmp|\.log|\.db|\.zip|\.tar|\.gz|\.rar|\.7z|cgi-bin|fckeditor|phpcms|dedecms|discuz|wordpress|drupal|joomla|magento|prestashop|opencart|oscommerce|zencart|cubecart|shopify|woocommerce|\.aspx|\.jsp|\.cgi|\.pl|\.py|\.rb|\.sh|\.bat|\.exe|\.dll|\.so|\.jar|\.war|\.ear).*","RequestProtocol":".*","RequestHost":".*","RequestAddr":".*","RequestPort":".*","OriginDuration":".*","OriginContentSize":".*","OriginStatus":"(404|403|400|401|500)","OriginStatusLine":".*","RequestReferer":".*","RequestUserAgent":".*","RequestCount":".*","RouterName":".*","ServiceName":".*","ServiceAddr":".*","ServiceURL":".*","ClientAddr":".*","ClientHost":".*","ClientPort":".*","ClientUsername":".*","Duration":".*","ResponseCode":".*","RetryAttempts":".*","TLSVersion":".*","TLSCipher":".*","TLSServerName":".*","DownstreamContentSize":".*","DownstreamStatus":".*","DownstreamStatusLine":".*"}$

ignoreregex =
