# Build the fc-base qcow2 with Packer (qemu builder) and publish it as a
# release asset on the corresponding sabokit GitHub Release.
#
# Triggers:
#   - push of any v* tag (production: ties image to release)
#   - manual dispatch with explicit image_version (for ad-hoc rebuilds)
#
# Required repo secrets:
#   none — the qemu builder runs offline against the upstream Ubuntu 22.04
#   LTS cloud image. Only the default GITHUB_TOKEN is used (for
#   `gh release upload`).
#
# Notes:
#   - `ubuntu-latest` runners ship /dev/kvm enabled, so the qemu builder
#     uses KVM acceleration. Build wallclock is ~12-18 min depending on the
#     apt mirror weather.
#   - Workflow timeout set to 45 min to leave headroom.

name: packer-publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_version:
        description: 'Image version (no leading v). Defaults to the triggering tag minus the v.'
        required: false
        type: string

permissions:
  contents: write   # gh release upload

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve image version
        id: ver
        run: |
          if [[ -n "${{ inputs.image_version }}" ]]; then
            v="${{ inputs.image_version }}"
          else
            v="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building fc-base-$v"

      - name: Install qemu + KVM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            cpu-checker \
            xorriso
          # Confirm /dev/kvm is present and accessible. GitHub-hosted
          # ubuntu-latest runners ship it post-2023; failing fast here makes
          # the cause obvious if a future runner image regresses.
          sudo chmod 666 /dev/kvm || true
          kvm-ok || true
          ls -la /dev/kvm

      - name: Install trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Install Packer
        # Pinned by SHA. Was @main — a mutable branch ref is a supply-chain
        # foothold: anyone landing a commit on that branch runs in this build.
        # Re-pin deliberately to a newer commit on upgrade.
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # tip of main as of pin
        with:
          version: '1.11.2'

      - name: packer init
        working-directory: platform/infra/base-image
        run: packer init .

      - name: packer build
        id: build
        working-directory: platform/infra/base-image
        run: |
          packer build \
            -var image_version=${{ steps.ver.outputs.version }} \
            .
          qcow2_path="output/fc-base-${{ steps.ver.outputs.version }}/fc-base-${{ steps.ver.outputs.version }}.qcow2"
          [ -f "$qcow2_path" ] || { echo "qcow2 not found at $qcow2_path" >&2; exit 1; }
          ls -lh "$qcow2_path"
          mv "$qcow2_path" "../../../fc-base-${{ steps.ver.outputs.version }}.qcow2"
          echo "qcow2_asset=fc-base-${{ steps.ver.outputs.version }}.qcow2" >> "$GITHUB_OUTPUT"

      - name: Scan qcow2 with trivy
        run: |
          # `trivy vm` only understands MBR-partitioned images; Ubuntu cloud
          # qcow2s are GPT. nbd-mount the rootfs and run `trivy fs` against
          # it instead — same vulnerability DB, same severity gating.
          qcow2="fc-base-${{ steps.ver.outputs.version }}.qcow2"
          sudo modprobe nbd max_part=8
          sudo qemu-nbd --read-only --connect=/dev/nbd0 "$qcow2"
          # Give the kernel a beat to enumerate partitions.
          for _ in $(seq 1 10); do
            sudo partprobe /dev/nbd0 2>/dev/null || true
            ls /dev/nbd0p* >/dev/null 2>&1 && break
            sleep 1
          done
          # Rootfs is the largest partition on Ubuntu cloud images.
          root_part="$(lsblk -lnpo NAME,SIZE -b /dev/nbd0 \
            | awk '$1 ~ /^\/dev\/nbd0p[0-9]+$/ {print $2, $1}' \
            | sort -nr | head -1 | awk '{print $2}')"
          [ -n "$root_part" ] || { echo "no partitions found on /dev/nbd0" >&2; exit 1; }
          echo "Mounting $root_part as rootfs"
          sudo mkdir -p /mnt/img
          sudo mount -o ro "$root_part" /mnt/img
          # Report HIGH+CRITICAL (non-blocking) then fail only on CRITICAL.
          trivy fs --severity HIGH,CRITICAL --exit-code 0 --no-progress /mnt/img
          trivy fs --severity CRITICAL --exit-code 1 --no-progress /mnt/img
          sudo umount /mnt/img
          sudo qemu-nbd --disconnect /dev/nbd0

      - name: Write image metadata sidecar
        run: |
          qcow2_sha256="$(sha256sum "fc-base-${{ steps.ver.outputs.version }}.qcow2" | awk '{print $1}')"
          qcow2_size="$(stat -c %s "fc-base-${{ steps.ver.outputs.version }}.qcow2")"
          cat > fc-base-${{ steps.ver.outputs.version }}.json <<EOF
          {
            "image_version": "${{ steps.ver.outputs.version }}",
            "qcow2_asset": "${{ steps.build.outputs.qcow2_asset }}",
            "qcow2_sha256": "${qcow2_sha256}",
            "qcow2_size_bytes": ${qcow2_size},
            "scaleway_region": "fr-par",
            "scaleway_zone": "fr-par-1"
          }
          EOF

      - name: Attach qcow2 + metadata to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Use the dispatch input as tag if we're on a manual run with no tag context.
          if [[ "$tag" == "${{ github.ref }}" ]]; then
            tag="v${{ steps.ver.outputs.version }}"
          fi
          # Create the release if it doesn't exist (manual dispatch path).
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "$tag" \
              --notes "Packer image fc-base-${{ steps.ver.outputs.version }}. Import via consumer-template/scripts/import-base-image.sh."
          fi
          gh release upload "$tag" --clobber \
            "${{ steps.build.outputs.qcow2_asset }}" \
            "fc-base-${{ steps.ver.outputs.version }}.json"
