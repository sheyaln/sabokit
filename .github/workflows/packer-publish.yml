# Build the fc-base qcow2 with Packer (qemu builder) and publish it as a
# release asset on the corresponding sabokit GitHub Release.
#
# Triggers:
#   - push of any v* tag (production: ties image to release)
#   - manual dispatch with explicit image_version (for ad-hoc rebuilds)
#
# Required repo secrets:
#   none — the qemu builder runs offline against the upstream Ubuntu 22.04
#   LTS cloud image. Only the default GITHUB_TOKEN is used (for
#   `gh release upload`).
#
# Notes:
#   - `ubuntu-latest` runners ship /dev/kvm enabled, so the qemu builder
#     uses KVM acceleration. Build wallclock is ~12-18 min depending on the
#     apt mirror weather.
#   - Workflow timeout set to 45 min to leave headroom.

name: packer-publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_version:
        description: 'Image version (no leading v). Defaults to the triggering tag minus the v.'
        required: false
        type: string

permissions:
  contents: write   # gh release upload

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image version
        id: ver
        run: |
          if [[ -n "${{ inputs.image_version }}" ]]; then
            v="${{ inputs.image_version }}"
          else
            v="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building fc-base-$v"

      - name: Install qemu + KVM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            cpu-checker \
            xorriso
          # Confirm /dev/kvm is present and accessible. GitHub-hosted
          # ubuntu-latest runners ship it post-2023; failing fast here makes
          # the cause obvious if a future runner image regresses.
          sudo chmod 666 /dev/kvm || true
          kvm-ok || true
          ls -la /dev/kvm

      - name: Install Packer
        uses: hashicorp/setup-packer@main
        with:
          version: '1.11.2'

      - name: packer init
        working-directory: packer
        run: packer init .

      - name: packer build
        id: build
        working-directory: packer
        run: |
          packer build \
            -var image_version=${{ steps.ver.outputs.version }} \
            .
          qcow2_path="output/fc-base-${{ steps.ver.outputs.version }}/fc-base-${{ steps.ver.outputs.version }}.qcow2"
          [ -f "$qcow2_path" ] || { echo "qcow2 not found at $qcow2_path" >&2; exit 1; }
          ls -lh "$qcow2_path"
          mv "$qcow2_path" "../fc-base-${{ steps.ver.outputs.version }}.qcow2"
          echo "qcow2_asset=fc-base-${{ steps.ver.outputs.version }}.qcow2" >> "$GITHUB_OUTPUT"

      - name: Write image metadata sidecar
        run: |
          cat > fc-base-${{ steps.ver.outputs.version }}.json <<EOF
          {
            "image_version": "${{ steps.ver.outputs.version }}",
            "qcow2_asset": "${{ steps.build.outputs.qcow2_asset }}",
            "scaleway_region": "fr-par",
            "scaleway_zone": "fr-par-1"
          }
          EOF

      - name: Attach qcow2 + metadata to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Use the dispatch input as tag if we're on a manual run with no tag context.
          if [[ "$tag" == "${{ github.ref }}" ]]; then
            tag="v${{ steps.ver.outputs.version }}"
          fi
          # Create the release if it doesn't exist (manual dispatch path).
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "$tag" \
              --notes "Packer image fc-base-${{ steps.ver.outputs.version }}. Import via consumer-template/scripts/import-base-image.sh."
          fi
          gh release upload "$tag" --clobber \
            "${{ steps.build.outputs.qcow2_asset }}" \
            "fc-base-${{ steps.ver.outputs.version }}.json"
