# Secret scanner. Fails the workflow if any verified-active secret is
# found in the scanned range.
#
# Triggers:
#   - pull_request: scan only the PR diff (action infers base/head)
#   - push to master: scan the merged commit range
#   - weekly cron: full-history sweep against master
#   - manual dispatch

name: trufflehog

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history needed for the scheduled/manual sweep; cheap enough
          # on PRs that we use it unconditionally rather than branching.
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab # v3.95.3
        with:
          # No base/head: the action infers the range per event — PR diff,
          # push commit range, full scan on schedule/dispatch. An explicit
          # head with empty base made every push/schedule run die with
          # "BASE and HEAD commits are the same". The action passes --fail
          # itself; repeating it in extra_args is an error.
          extra_args: --results=verified
