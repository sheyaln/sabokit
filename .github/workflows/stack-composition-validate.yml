---
# Stack composition layer validate.
#
# tests/local-validate/ exercises platform BUNDLES in isolation. This
# workflow exercises the four per-layer consumer roots
# (consumer-template/environments/_template/{infra,identity,operations,application}),
# which is where bugs that only manifest when bundles are wired together
# through the composition layer slip through.

name: stack-composition-validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # >= 1.10: the consumer roots' S3 backend uses use_lockfile.
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Run stack composition validate
        run: bash tests/stack-composition-validate/validate.sh
