# Build + push ghcr.io/<owner>/sabokit-runner:<tag> on every v*
# tag push. The image bakes ansible-core + collections + the entire platform/
# tree at the matching repo tag — see platform/infra/runner-image/README.md for the
# consumer-side usage.
#
# Triggers:
#   - push of any v* tag (production)
#   - manual dispatch with explicit version (ad-hoc rebuilds / backports)
#
# No external secrets — uses the workflow's GITHUB_TOKEN to push to ghcr.io.

name: runner-publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version (with leading v). Defaults to the triggering tag.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Higher ceiling: the arm64 leg builds under QEMU emulation on the amd64
    # runner (pip + ansible-galaxy), which is markedly slower than native.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve version
        id: ver
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF#refs/tags/}"
          fi
          [[ -n "$v" ]] || { echo "could not resolve version" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Only roll :latest forward for tag pushes (not manual backports).
          if [[ "${{ github.event_name }}" == "push" && "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: platform/infra/runner-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SABOKIT_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/sabokit-runner:${{ steps.ver.outputs.version }}
            ${{ steps.ver.outputs.tag_latest == 'true' && format('ghcr.io/{0}/sabokit-runner:latest', github.repository_owner) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
