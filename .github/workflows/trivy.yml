# Container CVE scan for the published sabokit-runner image.
#
# Triggers:
#   - push of a v* tag (scan the freshly-published runner image)
#   - weekly cron (catch newly-disclosed CVEs in already-tagged images)
#   - manual dispatch for ad-hoc scans
#
# Findings are uploaded as SARIF to the GitHub Security tab. The workflow
# does not fail on findings (exit-code: 0) — humans triage from the
# Security tab. Tighten to exit-code: 1 on the tag trigger once the
# baseline is clean.

name: trivy

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve image ref
        id: img
        run: |
          # On a tag push, scan that exact tag; otherwise scan :latest.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ref="${GITHUB_REF#refs/tags/}"
          else
            ref="latest"
          fi
          echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER}/sabokit-runner:${ref}" >> "$GITHUB_OUTPUT"

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-runner
