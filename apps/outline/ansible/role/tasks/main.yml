---
# Deploy Outline as a docker-compose stack. Secrets are pulled from Scaleway
# Secret Manager at deploy time and rendered into /opt/outline/.env (mode 0600).
#
# Required vars:
#   outline_hostname                  - full hostname
#   outline_app_secret_id             - Scaleway secret ID for the app's secret bag
#   outline_db_credentials_secret_id  - Scaleway secret ID for DB credentials
#
# Inherits docker installation via meta/main.yml.

- name: Validate required Outline variables
  ansible.builtin.assert:
    that:
      - outline_hostname | length > 0
      - outline_app_secret_id | length > 0
      - outline_db_credentials_secret_id | length > 0
    fail_msg: "outline_hostname, outline_app_secret_id and outline_db_credentials_secret_id are required."

- name: Ensure Outline directory exists
  ansible.builtin.file:
    path: "{{ outline_install_dir }}"
    state: directory
    mode: "0750"
    owner: root
    group: root

- name: Look up Outline app secrets from Scaleway
  ansible.builtin.set_fact:
    outline_app_secrets: "{{ lookup('scaleway.scaleway.scaleway_secret', outline_app_secret_id) | b64decode | from_json }}"
  no_log: true

- name: Look up Outline DB credentials from Scaleway
  ansible.builtin.set_fact:
    outline_db_credentials: "{{ lookup('scaleway.scaleway.scaleway_secret', outline_db_credentials_secret_id) | b64decode | from_json }}"
  no_log: true

- name: Look up SMTP config from Scaleway (best-effort)
  ansible.builtin.set_fact:
    outline_smtp_config: "{{ lookup('scaleway.scaleway.scaleway_secret', outline_smtp_secret_name, errors='ignore') | default('{}', true) | b64decode | from_json }}"
  no_log: true

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ outline_install_dir }}/docker-compose.yml"
    mode: "0644"
    owner: root
    group: root
  notify: Restart outline

- name: Render Outline environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ outline_install_dir }}/.env"
    mode: "0600"
    owner: root
    group: root
  notify: Restart outline
  no_log: true

- name: Ensure Outline stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ outline_install_dir }}"
    state: present
