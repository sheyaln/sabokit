# Per-env identity + sizing. Copy this whole _template dir to environments/<env>/
# and edit this file. The directory NAME is the environment label (used as the
# <org>-<env> resource-name suffix), so a copied dir can't carry another env's
# project_id. Every env MUST use a distinct scaleway_project_id.
#
# Secrets are NOT here — SCW_ACCESS_KEY / SCW_SECRET_KEY come from the
# environment (.envrc / sabokit-cli); the Authentik admin token is fetched from
# the infra bootstrap secret by the deploy scripts.

scaleway_project_id: "00000000-0000-0000-0000-000000000000" # replace with your project UUID
scaleway_region: fr-par
scaleway_zone: fr-par-1

base_domain: example.org
mgmt_domain: ""                 # empty collapses to base_domain
identity_domain: auth.example.org
infra_email: ops@example.org

private_network_subnet: 10.0.0.0/22   # /22 required when running managed Postgres

# Per-env instance sizing, keyed by host role (see hosts.yml). Lets staging run
# smaller than prod off the same topology.
compute_instance_types:
  tools: DEV1-L
  identity: DEV1-M
  management: DEV1-M
compute_disk_sizes:
  tools: 100
  identity: 30
  management: 60
