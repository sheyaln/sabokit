# Compute-host topology. Persistent (identical across envs); per-env instance
# sizing comes from env.yml (compute_instance_types/compute_disk_sizes, keyed by
# role) and is merged in each layer's stack.tf. Read by infra (creates the
# instances) and by operations/application (resolve deployment_host_key).
#
# Canonical 3-host split: tools (user-facing apps), identity (Authentik),
# management (observability + automation).
#
# Single-VM dev: collapse to one host and list every group under ansible_groups
# so each play still finds its target group:
#   compute_hosts:
#     all:
#       role: tools
#       ansible_group: tools
#       ansible_groups: [tools, identity, management]

compute_hosts:
  tools:
    role: tools
    ansible_group: tools
    protected: true
  identity:
    role: identity
    ansible_group: identity
    protected: true
  management:
    role: management
    ansible_group: management
    protected: true
