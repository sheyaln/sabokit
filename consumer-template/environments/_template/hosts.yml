# Compute-host topology. Persistent (identical across envs); per-env instance
# sizing comes from env.yml (compute_instance_types/compute_disk_sizes, keyed by
# host KEY) and is merged in each layer's stack.tf. Read by infra (creates the
# instances) and by operations/application (resolve deployment_host_key).
#
# `role` is the canonical enum the per-role security-group superset keys on:
#   apps     — user-facing apps (jitsi/Talk media ports)
#   identity — Authentik gateway
#   ops      — observability (Alloy ingest + wazuh manager ports)
# The host KEY (tools/identity/management here) is just a descriptive name; it
# need not equal the role. A role outside the enum gets only the 22/80/443
# baseline — add ports with extra_inbound_rules_by_role in infra.yml.
#
# Single-VM dev: collapse to one host, role `apps`, and list every group under
# ansible_groups so each play still finds its target group:
#   compute_hosts:
#     all:
#       role: apps
#       ansible_group: apps
#       ansible_groups: [tools, identity, management]

compute_hosts:
  tools:
    role: apps
    ansible_group: tools
    protected: true
  identity:
    role: identity
    ansible_group: identity
    protected: true
  management:
    role: ops
    ansible_group: management
    protected: true
