# Application-layer config: the user-facing app suite. Each block is passed
# through verbatim to its bundle; see platform/application/<app>/terraform/
# variables.tf (or apps-manifest.yaml) for every knob. Read by the application
# root only.
#
# Hostnames are FULL (bundles never assemble subdomains). Disabled apps may be
# omitted entirely. authorized_groups defaults per app (member-collaboration /
# delegate-management / admin-infra) — override to widen or narrow access.

outline:
  enabled: true
  hostname: wiki.example.org
  # authorized_groups: [member]   # default; [member] admits every tier via nesting

