          description: Authentik group names allowed to access this app. Higher tiers nest under lower ones in Authentik, so naming a baseline tier also admits every tier above it. Default [admin] is admin-only — n8n automation can reach everything.
          ui: advanced

        monitoring_enabled:
          type: bool
          default: true
          description: Wire n8n log paths into the monitoring stack.
          ui: advanced

        category_group:
          type: string
          default: Technical Management
          description: Section the app appears under in the Authentik portal.
          ui: advanced

        application_name:
          type: string
          default: n8n Workflows
          description: Display name for the Authentik portal entry. Override for branded portals.
          ui: advanced

        application_slug:
          type: string
          default: ""
          description: Override the Authentik application slug. Default empty = use the bundle's stock slug (`n8n`). Set to a legacy slug to enable in-place import without force-replace.
          ui: advanced

        dns_zone_override:
          type: string
          default: ""
          description: Override the DNS zone for this app's A record. Default empty derives from hostname suffix matching against base.domains.zones. Set only for edge cases.
