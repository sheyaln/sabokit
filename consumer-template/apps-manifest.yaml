        icon_filename:
          type: string
          default: n8n-icon.png
          description: Icon filename to fetch from base.authentik.icon_base_url. Empty = no icon. Overridden by icon_url (full URL).
          ui: advanced

        icon_url:
          type: string
          default: ""
          description: Full icon URL override. When set, used verbatim and icon_filename is ignored.
          ui: advanced

        service_account_extra_group_ids:
          type: list(string)
          default: []
          description: Direct Authentik group IDs to add the n8n service account to. For cross-bundle wiring; consumer-template auto-adds broadsheet's group when both enabled (see broadsheet_membership).
          ui: advanced

        broadsheet_membership:
          type: bool
          default: true
          description: When both n8n and broadsheet are deployed, automatically add n8n's service account to broadsheet's per-app Authentik group so n8n workflows can authenticate to broadsheet. Set false to opt out.
          ui: advanced

        # ── Identity-pipeline workflow env ──
        # Consumed by the workflows at platform/identity/n8n-workflows/.
        # Rendered into n8n's container .env via the n8n bundle's
        # extra_env_vars input. See identity/n8n-workflows/README.md.
        slack_channel_new_signups:
          type: string
          default: ""
          description: Slack channel name where the parent dispatcher posts new-signup + activation messages (e.g. "#new-signups"). Empty disables.
          ui: advanced

        slack_channel_admin_alerts:
          type: string
          default: ""
          description: Slack channel name for admin-only alerts from subworkflows (e.g. EspoCRM duplicate-member warnings). Empty disables.
          ui: advanced

        broadsheet_workspace_id:
          type: string
          default: ""
          description: Broadsheet workspace ID the All Members list lives in. Required if Broadsheet is enabled. Typically the org slug.
          ui: advanced

        broadsheet_all_members_list_id:
          type: string
          default: allmembers
          description: Broadsheet list ID for the All Members mailing list (alphanumeric, ≤32 chars). Created on first signup if missing.
          ui: advanced

        broadsheet_all_members_list_name:
          type: string
          default: All Members
          description: Human-readable name for the All Members list when auto-created.
          ui: advanced

        workflow_id_broadsheet_subscribe:
          type: string
          default: ""
          description: n8n workflow ID of the imported broadsheet-allmembers-subscribe subworkflow. Capture from the n8n UI URL after first import, then re-apply.
          ui: advanced

        workflow_id_espocrm_upsert:
          type: string
          default: ""
          description: n8n workflow ID of the imported espocrm-member-upsert subworkflow. Capture from the n8n UI URL after first import, then re-apply.
          ui: advanced

        workflow_id_slack_invite_stub:
          type: string
          default: ""
          description: n8n workflow ID of the imported slack-invite-stub subworkflow. Capture from the n8n UI URL after first import, then re-apply.
          ui: advanced

        extra_env_vars:
          type: map(string)
          default: {}
          description: Ad-hoc env vars merged into n8n's container .env. Merged AFTER the platform-wired vars above, so consumer entries with the same key win.
          ui: advanced

        extra_docker_networks:
          type: list(string)
          default: []
          description: Extra docker networks to attach n8n's container to (beyond the bundle's defaults). For cross-bundle integration with sidecars like protonmail-bridge that live in their own bootstrap-tier network. Networks must already exist on the host.
          ui: advanced

        workflows_dir:
          type: string
          default: ""
          description: Path to a local directory of n8n workflow JSON exports to auto-import on each deploy. Resolved by the Ansible controller — relative paths resolve against the playbook invocation cwd (consumer-template root), absolute paths used verbatim. When set, the role syncs the directory to the apps host and runs `n8n import:workflow --separate --input=/workflows-import/` inside the container after it's healthy. n8n upserts by workflow `id`, so re-runs are idempotent. Empty = feature off. Convention is `consumer-template/workflows/` with `workflows_dir = "../../workflows"`.
          example: ../../workflows
          ui: advanced

  # ── Backrest ────────────────────────────────────────────────────────────
  # Restic-based backups per host (each host = its own instance + bucket).
  # Forward-auth via the embedded outpost. Multi-instance: consumers
  # instantiate one module block per backed-up host. The manifest declares
  # the bundle once; the wizard prompts for instance_name + backup_plans.
  - id: backrest
    display_name: Backrest
    category: ops
    description_short: Per-host restic backups with web UI
    description: |
      Web UI on top of restic. Each backed-up host gets its own backrest
      instance with its own S3 bucket and its own restic repo, so a leaked
      IAM key only touches one host's snapshots. Restic encryption password
      is immutable after first apply — rotation breaks every snapshot.
    icon: icons/backrest.svg
    upstream_url: https://github.com/garethgeorge/backrest

    config:
      key: backrest
      schema:
        enabled:
          type: bool
          default: true
          description: Whether backrest is deployed. Defaults to true — backrest auto-instantiates per `compute_hosts` entry at v3.4.0+; opt a host out via `var.apps.backrest.disabled_hosts = ["<host_key>"]`. Per-host overrides live under `var.apps.backrest.per_host[<host_key>]`.
          ui: hidden


        hostname:
          type: string
          required: true
          description: Public hostname this backrest instance is served at.
          example: backup.mgmt.example.org
          ui: text
          validation:
            pattern: ^[a-z0-9.-]+\.[a-z]{2,}$

        instance_name:
          type: string
          required: true
          description: Per-instance namespace (3-32 chars, lowercase, digits, hyphens). Used in bucket name, IAM principal name, secret name, container name, install dir.
          example: mgmt
          ui: text

        deployment_host_key:
          type: string
          default: tools
          description: Which host (key in compute_hosts) this backrest instance runs on. Typically the host you're backing up.
          ui: advanced

        authorized_groups:
          type: list(string)
          default: [admin]
          description: Authentik group names allowed to access this app. Higher tiers nest under lower ones in Authentik, so naming a baseline tier also admits every tier above it. Default [admin] is admin-only — Backrest exposes raw paths and a restore UI.
          ui: advanced

        monitoring_enabled:
          type: bool
          default: true
          description: Wire backrest log paths into the monitoring stack.
          ui: advanced

        category_group:
          type: string
          default: Technical Management
          description: Section the app appears under in the Authentik portal.
          ui: advanced

        application_name:
          type: string
          default: ""
          description: Display name for the Authentik portal entry. Empty default keeps the per-instance shape `Backrest (<instance_name>)`; set to a literal string for branded portals.
          ui: advanced

        icon_filename:
          type: string
          default: backrest-icon.png
          description: Icon filename to fetch from base.authentik.icon_base_url. Empty = no icon. Overridden by icon_url (full URL).
          ui: advanced

        icon_url:
          type: string
          default: ""
          description: Full icon URL override. When set, used verbatim and icon_filename is ignored.
          ui: advanced

        bucket_name_override:
          type: string
          default: ""
          description: Override the Scaleway object bucket name. Use to import a legacy bucket without force-replace. Drop once data is migrated to the canonical naming pattern.
          ui: advanced

        dns_zone_override:
          type: string
          default: ""
          description: Override the DNS zone for this app's A record. Default empty derives from hostname suffix matching against base.domains.zones. Set only for edge cases.
          ui: advanced

        extra_env_vars:
          type: map(string)
          default: {}
          description: Map of KEY -> value rendered into the container .env after first-class vars. Use for env-driven feature flags / third-party integrations / debug toggles not exposed first-class on the bundle.
          ui: advanced

        extra_docker_networks:
          type: list(string)
          default: []
          description: Extra docker networks to attach the bundle's main container to (beyond the bundle's defaults). Networks must already exist on the host. Use for cross-bundle integration with sidecars like protonmail-bridge that live in their own bootstrap-tier network.
          ui: advanced

  # Diun (notify-on-new-image) moved to platform/base/host-services/ at v3.4.0
  # and auto-instantiates per compute_host. It's a base-tier setting now, not
  # an app — configure via `var.base.diun.{enabled, disabled_hosts, ...}`. The
  # apps-manifest schema is for app bundles only; host-services live under
  # `var.base` and don't fit this schema.

  # Autoheal moved to platform/base/host-services/ in v3.4.0 and is now
  # auto-instantiated per compute_host by the base layer (default-on).
  # Consumer disables via `base.autoheal.enabled = false` or per-host opt-out
  # via `base.autoheal.disabled_hosts = [...]`. See platform/base/host-services/README.md.

  # ── Prometheus ──────────────────────────────────────────────────────────
  # TSDB + node_exporter + cadvisor sidecars. Headless; access via Grafana.
  # Scrape configs auto-aggregated from each enabled app's monitoring output.
  - id: prometheus
    display_name: Prometheus
    category: ops
    description_short: Metrics TSDB + host & container exporters
    description: |
      Prometheus time-series database with node_exporter and cadvisor
      sidecars on the same host. Scrape configs and alert rules are
      aggregated by the consumer-template from each enabled app's
      monitoring output — bundles own their scraping, consumer plumbs.
    icon: icons/prometheus.svg
    upstream_url: https://github.com/prometheus/prometheus

    config:
      key: prometheus
      schema:
        enabled:
          type: bool
          default: false
          description: Whether Prometheus is deployed.
          ui: hidden

        deployment_host_key:
          type: string
          default: management
          description: Which host this Prometheus runs on.
          ui: advanced

        retention:
          type: string
          default: "30d"
          description: TSDB retention window (Prometheus duration). Storage scales linearly with this and sample rate.
          ui: text

        exporters_enabled:
          type: bool
          default: true
          description: Deploy node_exporter + cadvisor sidecars alongside Prometheus.
          ui: advanced

        private_ip_bind:
          type: string
          default: ""
          description: Optional private IP to bind 9090 to. Empty = 127.0.0.1 only.
          ui: advanced

        tem_exporter_enabled:
          type: bool
          default: false
          description: Deploy the Scaleway TEM exporter sidecar. Polls TEM's API + exposes outbound-email metrics for the bundled scaleway-tem dashboard + alert rules.
          ui: advanced

        tem_exporter_poll_interval_seconds:
          type: number
          default: 60
          description: How often the TEM exporter polls Scaleway's API.
          ui: advanced

        tem_exporter_lookback_minutes:
          type: number
          default: 60
          description: Rolling window the TEM exporter uses for per-flag / per-status counts (drives bounce-rate, spam-rate alerts).
          ui: advanced

        extra_scrape_targets:
          type: map(list(string))
          default: {}
          description: Extra Prometheus scrape jobs as job_name → list(host:port). For cross-host base-exporter scrapes (node_exporter, cadvisor, traefik metrics on every infra host) when the management host needs to scrape over the VPC. Consumer fills from their host inventory.
          ui: advanced

        extra_env_vars:
          type: map(string)
          default: {}
          description: Map of KEY -> value rendered into the container .env after first-class vars. Use for env-driven feature flags / third-party integrations / debug toggles not exposed first-class on the bundle.
          ui: advanced

        extra_docker_networks:
          type: list(string)
          default: []
          description: Extra docker networks to attach the bundle's main container to (beyond the bundle's defaults). Networks must already exist on the host. Use for cross-bundle integration with sidecars like protonmail-bridge that live in their own bootstrap-tier network.
          ui: advanced

  # ── Loki ────────────────────────────────────────────────────────────────
  - id: loki
    display_name: Loki
    category: ops
    description_short: Log aggregation, single-tenant filesystem store
    description: |
      Receives log pushes from Alloy/Promtail agents on every host. Grafana
      reads back via its Loki datasource. Single-tenant + filesystem store —
      replace templates/loki-config.yml.j2 for multi-tenant or S3.
    icon: icons/loki.svg
    upstream_url: https://grafana.com/oss/loki/

    config:
      key: loki
      schema:
        enabled:
          type: bool
          default: false
          description: Whether Loki is deployed.
          ui: hidden

        deployment_host_key:
          type: string
          default: management
          description: Which host this Loki runs on.
          ui: advanced

        retention:
          type: string
          default: "744h"
          description: Log retention window (Loki schema duration). ~31d.
          ui: text

        private_ip_bind:
          type: string
          default: ""
          description: Optional private IP to bind 3100 to (for remote agents pushing logs).
          ui: advanced

        extra_env_vars:
          type: map(string)
          default: {}
          description: Map of KEY -> value rendered into the container .env after first-class vars. Use for env-driven feature flags / third-party integrations / debug toggles not exposed first-class on the bundle.
          ui: advanced

        extra_docker_networks:
          type: list(string)
          default: []
          description: Extra docker networks to attach the bundle's main container to (beyond the bundle's defaults). Networks must already exist on the host. Use for cross-bundle integration with sidecars like protonmail-bridge that live in their own bootstrap-tier network.
          ui: advanced

  # ── Grafana ─────────────────────────────────────────────────────────────
  - id: grafana
    display_name: Grafana
    category: ops
    description_short: Dashboards UI for Prometheus + Loki
    description: |
      Grafana UI behind Authentik OIDC. Datasources for Prometheus + Loki
      auto-provisioned. OIDC role mapping: admin group → Admin, manager
      group → Editor, everyone else → Viewer (override per-group).
    icon: icons/grafana.svg
    upstream_url: https://github.com/grafana/grafana

    config:
      key: grafana
      schema:
        enabled:
          type: bool
          default: false
          description: Whether Grafana is deployed.
          ui: hidden


        hostname:
          type: string
          required: true
          description: Public hostname Grafana is served at.
          example: grafana.example.org
          ui: text
          validation:
            pattern: ^[a-z0-9.-]+\.[a-z]{2,}$

        deployment_host_key:
          type: string
          default: management
          description: Which host this Grafana runs on. Should match prometheus + loki for in-network DNS.
          ui: advanced

        authorized_groups:
          type: list(string)
          default: [admin]
          description: Authentik group names allowed to access this app. Higher tiers nest under lower ones in Authentik, so naming a baseline tier also admits every tier above it. Default [admin] is admin-only — Grafana is an ops dashboard.
          ui: advanced

        oidc_admin_group:
          type: string
          default: admin
          description: Authentik group name whose members get Grafana Admin role.
          ui: advanced

        oidc_editor_group:
          type: string
          default: manager
          description: Authentik group name whose members get Grafana Editor role.
          ui: advanced

        plugins:
          type: list(string)
          default: []
          description: Grafana plugins to preinstall via GF_PLUGINS_PREINSTALL.
          ui: advanced

        category_group:
          type: string
          default: Technical Management
          description: Authentik portal category.
          ui: advanced

        application_name:
          type: string
          default: Grafana
          description: Display name for the Authentik portal entry. Override for branded portals.
          ui: advanced

        application_slug:
          type: string
          default: ""
          description: Override the Authentik application slug. Default empty = use the bundle's stock slug (`grafana`). Set to a legacy slug to enable in-place import without force-replace.
          ui: advanced

        dns_zone_override:
          type: string
          default: ""
          description: Override the DNS zone for this app's A record. Default empty derives from hostname suffix matching against base.domains.zones. Set only for edge cases.
          ui: advanced

        icon_filename:
          type: string
          default: grafana-icon.png
          description: Icon filename to fetch from base.authentik.icon_base_url. Empty = no icon. Overridden by icon_url (full URL).
          ui: advanced

        icon_url:
          type: string
          default: ""
          description: Full icon URL override. When set, used verbatim and icon_filename is ignored.
          ui: advanced

        prometheus_url:
          type: string
          default: "http://prometheus:9090"
          description: URL Grafana uses to reach Prometheus. Default works when prometheus is co-deployed on the same host and they share the monitoring docker network.
          ui: advanced

        loki_url:
          type: string
          default: "http://loki:3100"
          description: URL Grafana uses to reach Loki. Default works when loki is co-deployed on the same host.
          ui: advanced

        prometheus_scrape_interval:
          type: string
          default: "30s"
          description: Scrape interval Grafana's Prometheus datasource expects. Should match the prometheus bundle's global.scrape_interval.
          ui: advanced

        jsm_api_key_secret_id:
          type: string
          default: ""
          description: Scaleway secret ID holding the JSM Operations (heritage Opsgenie) API integration key as `{"api_key":"..."}`. Empty disables JSM provisioning. When set, Grafana provisions a `jsm-default` contact point routed from the root notification policy.
          ui: advanced

        jsm_api_region:
          type: string
          default: "us"
          description: JSM API region — "us" or "eu". Pick the one matching your Atlassian site.
          ui: advanced

        jsm_priority_mapping:
          type: map(string)
          default: { critical: "P1", warning: "P3", info: "P5" }
          description: Map of Grafana alert `severity` label value to JSM priority (P1-P5). Override per your on-call runbook.
          ui: advanced

        jsm_alert_tags:
          type: list(string)
          default: ["sabokit"]
          description: Tags attached to every alert sent to JSM. Useful for JSM routing rules.
          ui: advanced

        jsm_severity_gate:
          type: string
          default: ""
          description: >-
            Gate label matcher for a JSM child policy. Empty (default) = JSM is the root contact when jsm_api_key_secret_id is set. Non-empty (e.g. "critical") = root stays on Grafana's built-in `grafana-default` contact (wire it to n8n / your own fan-out separately) and JSM moves to a child policy matching `severity = <value>` with `continue: true`, so qualifying alerts route to BOTH targets. Only consulted when jsm_api_key_secret_id is non-empty.
          ui: advanced

        extra_env_vars:
          type: map(string)
          default: {}
          description: Map of KEY -> value rendered into the container .env after first-class vars. Use for env-driven feature flags / third-party integrations / debug toggles not exposed first-class on the bundle.
          ui: advanced

        extra_docker_networks:
          type: list(string)
          default: []
          description: Extra docker networks to attach the bundle's main container to (beyond the bundle's defaults). Networks must already exist on the host. Use for cross-bundle integration with sidecars like protonmail-bridge that live in their own bootstrap-tier network.
          ui: advanced

  # ── Wazuh ───────────────────────────────────────────────────────────────
  # SIEM server stack: manager + indexer (OpenSearch) + dashboard. UI fronted
  # via Authentik forward-auth at the gateway (the dashboard's native SSO is
  # OpenSearch-flavoured; full OIDC would need custom config.yml for the
  # opensearch-security plugin).
  - id: wazuh
    display_name: Wazuh
    category: ops
    description_short: SIEM + endpoint detection
    description: |
      Three lockstep containers: manager, indexer (OpenSearch fork),
      dashboard. SSL certs auto-generated on first deploy via the official
      wazuh-certs-generator. Manager exposes TCP 1514/1515 + UDP 514 for
      agent traffic (auto-opened in the host SG via required_inbound_rules).
      Agent role for monitored hosts ships in v2.7.1.
    icon: icons/wazuh.svg
    upstream_url: https://wazuh.com/

    config:
      key: wazuh
      schema:
        enabled:
          type: bool
          default: false
          description: Whether Wazuh is deployed.
          ui: hidden


        hostname:
          type: string
          required: true
          description: Public hostname the Wazuh dashboard is served at.
          example: wazuh.example.org
          ui: text
          validation:
            pattern: ^[a-z0-9.-]+\.[a-z]{2,}$

        deployment_host_key:
          type: string
          default: management
          description: Which host the Wazuh manager runs on.
          ui: advanced

        authorized_groups:
          type: list(string)
          default: [admin]
          description: Authentik group names allowed to access this app. Higher tiers nest under lower ones in Authentik, so naming a baseline tier also admits every tier above it. Default [admin] is admin-only — Wazuh is SIEM + active response.
          ui: advanced

        release_version:
          type: string
          default: "4.9.0"
          description: Wazuh release. All three images (manager, indexer, dashboard) move in lockstep.
          ui: text

        indexer_heap_size:
          type: string
          default: "1g"
          description: JVM heap size for the indexer (OpenSearch). 50% of host RAM, max 31g.
          ui: advanced

        category_group:
          type: string
          default: Technical Management
          description: Authentik portal category.
          ui: advanced

        application_name:
          type: string
          default: Wazuh
          description: Display name for the Authentik portal entry. Override for branded portals.
          ui: advanced

        application_slug:
          type: string
          default: ""
          description: Override the Authentik application slug. Default empty = use the bundle's stock slug (`wazuh`). Set to a legacy slug to enable in-place import without force-replace.
          ui: advanced

        dns_zone_override:
          type: string
          default: ""
          description: Override the DNS zone for this app's A record. Default empty derives from hostname suffix matching against base.domains.zones. Set only for edge cases.
          ui: advanced

        icon_filename:
          type: string
          default: wazuh-icon.png
          description: Icon filename to fetch from base.authentik.icon_base_url. Empty = no icon. Overridden by icon_url (full URL).
          ui: advanced

        icon_url:
          type: string
          default: ""
          description: Full icon URL override. When set, used verbatim and icon_filename is ignored.
          ui: advanced

        manager_agent_port:
          type: number
          default: 1514
          description: TCP port the Wazuh manager listens on for agent connections.
          ui: advanced

        manager_enrollment_port:
          type: number
          default: 1515
          description: TCP port the Wazuh manager listens on for agent enrollment.
          ui: advanced

        manager_syslog_port:
          type: number
          default: 514
          description: UDP port the Wazuh manager listens on for syslog ingestion.
          ui: advanced

        oidc_admin_group:
          type: string
          default: admin
          description: Authentik group whose members are mapped to opensearch's all_access role (full dashboard + active-response). Matches against the OIDC `groups` claim.
          ui: advanced

        oidc_readonly_group:
          type: string
          default: ""
          description: Optional Authentik group mapped to opensearch's kibana_user + readall (dashboard access without write/active-response privileges). Empty disables (admin-only).
          ui: advanced

        extra_env_vars:
          type: map(string)
          default: {}
          description: Map of KEY -> value rendered into the container .env after first-class vars. Use for env-driven feature flags / third-party integrations / debug toggles not exposed first-class on the bundle.
          ui: advanced

        extra_docker_networks:
          type: list(string)
          default: []
          description: Extra docker networks to attach the bundle's main container to (beyond the bundle's defaults). Networks must already exist on the host. Use for cross-bundle integration with sidecars like protonmail-bridge that live in their own bootstrap-tier network.
          ui: advanced

# ── Host-services tier ────────────────────────────────────────────────────
# Per-host services auto-instantiated by module.base for every compute_host.
# Default-on; consumers turn off via `var.base.<service>.enabled = false`
# (whole service) or `var.base.<service>.disabled_hosts = [...]` (per-host).
# Consumer-template wires these via `var.base.<service>` in config.tf (passed to module.stack).
host_services:
  # ── Wazuh Agent ─────────────────────────────────────────────────────────
  # HIDS log-shipper. One instance per compute_host, auto-instantiated by
  # module.base. Default on because SSH-as-deploy means hosts are always
  # exposed and host-level intrusion detection is a sensible production
  # default. Consumers without a wazuh manager set `enabled = false`.
  - id: wazuh-agent
    display_name: Wazuh Agent
    category: ops
    description_short: HIDS log-shipper running on every host
    description: |
      Auto-enrolls against the manager via WAZUH_MANAGER_SERVER. Uses
      host networking so the agent can monitor host-level logs and reach
      the manager directly. release_version MUST match the manager's.
      Manager address auto-wires from `module.wazuh.manager_private_ip`
      when the wazuh manager app is enabled in the same stack.
    icon: icons/wazuh.svg
    upstream_url: https://documentation.wazuh.com/current/installation-guide/wazuh-agent/

    config:
      key: wazuh_agent
      schema:
        enabled:
          type: bool
          default: true
          description: Master toggle for the whole service. Set false when no wazuh manager is reachable.
          ui: advanced

        disabled_hosts:
          type: list(string)
          default: []
          description: compute_host keys to skip. Lists every host name to opt that host out of agent provisioning while keeping the service on for the rest.
          ui: advanced

        manager_address:
          type: string
          default: ""
          description: Network address of the Wazuh manager (private IP or DNS). Auto-wires from module.wazuh.manager_private_ip when the manager app is enabled.
          ui: text

        release_version:
          type: string
          default: "4.9.0"
          description: Image tag. MUST match the manager's release_version.
          ui: text

        image:
          type: string
          default: "wazuh/wazuh-agent"
          description: Image repo without tag.
          ui: advanced

        fim_enabled:
          type: bool
          default: true
          description: File Integrity Monitoring master toggle. Ships syscheck + auditd integration on standard sensitive paths.
          ui: advanced

        fim_extra_paths:
          type: list(string)
          default: []
          description: Extra absolute paths to monitor on top of the standard set.
          ui: advanced

        fim_extra_exclusions:
          type: list(string)
          default: []
          description: Paths to suppress from FIM reporting (syscheck `<ignore>` entries).
          ui: advanced

        diun_watch_enabled:
          type: bool
          default: true
          description: Whether Diun watches the agent's containers for upstream image updates.
          ui: advanced

        autoheal_enabled:
          type: bool
          default: true
          description: Whether autoheal restarts the agent on healthcheck failure.
          ui: advanced

        extra_env_vars:
          type: map(string)
          default: {}
          description: Map of KEY -> value rendered into the container .env after first-class vars.
          ui: advanced

# ── Bootstrap-tier bundles ────────────────────────────────────────────────
# Host services apps depend on (inbound mail, etc). Sibling to `apps` —
# separated because these aren't user-facing apps. Consumer-template wires
# them via `var.bootstrap.<bundle>` in config.tf (passed to module.stack).
bootstrap:
  # ── ProtonMail Bridge ───────────────────────────────────────────────────
  # IMAP gateway for apps that fetch mail from a ProtonMail account (e.g.
  # n8n workflows polling an inbox). SMTP outbound stays on Scaleway TEM at
  # the base tier.
  - id: protonmail-bridge
    display_name: ProtonMail Bridge
    category: mail
    description_short: IMAP gateway to a ProtonMail account
    description: |
      Runs the community ProtonMail Bridge image so apps inside the stack
      can fetch mail from a ProtonMail account over IMAP. Apps read the
      `imap-config` Scaleway secret this bundle writes.
    config:
      key: protonmail_bridge
      schema:
        enabled:
          type: bool
          default: false
          description: Master toggle.
          ui: toggle

        imap_username:
          type: string
          default: ""
          description: ProtonMail account email. Apps use this as their IMAP username. REQUIRED when enabled.
          ui: text

        bridge_login_secret_id:
          type: string
          default: ""
          description: Scaleway secret ID holding the bridge's service-specific password (NOT the ProtonMail account password). Generate via ProtonMail Settings → Bridge, store in Scaleway out-of-band, paste the ID here. REQUIRED when enabled.
          ui: text

        deployment_host_key:
          type: string
          default: "management"
          description: Compute host the bridge runs on. Must be reachable from every host with apps that fetch mail through it.
          ui: advanced

        image_tag:
          type: string
          default: "latest"
          description: Bridge image tag.
          ui: advanced

        timezone:
          type: string
          default: "UTC"
          description: IANA timezone for the container.
          ui: advanced

        imap_config_secret_name:
          type: string
          default: "imap-config"
          description: Scaleway secret name this bundle writes. Override only when running multiple bridge instances per env.
          ui: advanced

        diun_watch_enabled:
          type: bool
          default: false
          description: Whether Diun watches the bridge container for upstream image updates. Default false — bridge schema migrations between minor versions need the manual re-login flow, so notification noise isn't actionable.
          ui: advanced

        autoheal_enabled:
          type: bool
          default: true
          description: Whether Autoheal restarts the container on healthcheck failure.
          ui: advanced

        extra_env_vars:
          type: map(string)
          default: {}
          description: Map of KEY -> value rendered into the container .env after first-class vars. Use for env-driven feature flags / third-party integrations / debug toggles not exposed first-class on the bundle.
          ui: advanced

        extra_docker_networks:
          type: list(string)
          default: []
          description: Extra docker networks to attach the bundle's main container to (beyond the bundle's defaults). Networks must already exist on the host. Use for cross-bundle integration with sidecars like protonmail-bridge that live in their own bootstrap-tier network.
          ui: advanced
