# Apps Manifest — sabokit v1 contract
#
# Producer-curated declaration of every app bundle a consumer can deploy.
# Consumed by GUI tools (e.g. Sabokit Manager) to render the app-selection
# step of a deploy wizard without having to read the underlying Terraform.
#
# Schema authority: sabokit (producer).
# Consumer authority: how/when fields render in the UI.
#
# ── Versioning ────────────────────────────────────────────────────────────
# Within a `schema_version`, only additive changes (new optional fields, new
# apps). Removing or changing the meaning of any existing field requires a
# `schema_version` bump. Consumers can safely ignore unknown fields forward.
#
# ── Boundary ──────────────────────────────────────────────────────────────
# This file declares per-app inputs ONLY. Blueprint-wide inputs
# (`base_domain`, `org_slug`, `infra_email`, `scaleway_*`, `compute_hosts`)
# are NOT here — wizards collect those in an earlier phase.
#
# ── Coverage check ────────────────────────────────────────────────────────
# `scripts/check-manifest-coverage.sh` runs on every PR. It validates that
# every entry's `config.schema` refers to a real input in the corresponding
# `platform/apps/<id>/terraform/variables.tf` and that any required input
# the producer surfaces is one the consumer can actually set.

schema_version: 1

apps:
  # ── Outline ─────────────────────────────────────────────────────────────
  # Team wiki. The only shipping bundle today; canonical reference for the
  # app contract. See platform/apps/outline/terraform/variables.tf.
  - id: outline
    display_name: Outline
    category: collaboration
    description_short: Team wiki with Markdown + SSO
    description: |
      Modern team wiki with Markdown editing, real-time collaboration,
      and federated SSO via Authentik. Backed by managed Postgres + an
      S3-compatible bucket for attachments.
    icon: icons/outline.svg
    docs_url: https://www.getoutline.com/developers
    upstream_url: https://github.com/outline/outline

    config:
      key: outline
      schema:
        enabled:
          type: bool
          default: true
          description: Whether Outline is deployed in this environment.
          ui: hidden


        hostname:
          type: string
          required: true
          description: Public hostname Outline is served at.
          example: wiki.example.org
          # subdomain_default is a UX prefill hint, NOT a validation
          # constraint. Consumers may prefill `<subdomain_default>.<base_domain>`
          # on first render of this field. The user can edit to any value
          # that passes `validation.pattern`.
          subdomain_default: wiki
          ui: text
          validation:
            pattern: ^[a-z0-9.-]+\.[a-z]{2,}$

        deployment_host_key:
          type: string
          default: tools
          description: Which host (key in compute_hosts) Outline runs on.
          ui: advanced

        authorized_groups:
          type: list(string)
          default: [member]
          description: Authentik group names allowed to access this app. Higher tiers nest under lower ones in Authentik, so naming a baseline tier also admits every tier above it. Default [member] admits the whole membership.
          ui: advanced

        smtp_from_email:
          type: string
          default: ''
          description: From-address for transactional email. Empty disables SMTP.
          example: wiki@example.org
          ui: advanced

        monitoring_enabled:
          type: bool
          default: true
          description: Wire Outline metrics + dashboards into the monitoring stack.
          ui: advanced

        category_group:
          type: string
          default: Collaboration
          description: Section the app appears under in the Authentik portal.
          ui: advanced

        application_name:
          type: string
          default: Wiki (Outline)
          description: Display name for the Authentik portal entry. Override for branded portals.
          ui: advanced

        application_slug:
          type: string
          default: ""
          description: Override the Authentik application slug. Default empty = use the bundle's stock slug (`outline`). Set to a legacy slug to enable in-place import without force-replace.
          ui: advanced

        bucket_name_override:
          type: string
          default: ""
          description: Override the Scaleway object bucket name. Use to import a legacy bucket without force-replace. Drop once data is migrated to the canonical naming pattern.
          ui: advanced

        dns_zone_override:
          type: string
          default: ""
          description: Override the DNS zone for this app's A record. Default empty derives from hostname suffix matching against base.domains.zones. Set only for edge cases.
          ui: advanced

        icon_filename:
          type: string
          default: outline-icon.png
          description: Icon filename to fetch from base.authentik.icon_base_url. Empty = no icon. Overridden by icon_url (full URL).
          ui: advanced

        icon_url:
          type: string
          default: ""
          description: Full icon URL override. When set, used verbatim and icon_filename is ignored.
          ui: advanced

        extra_docker_networks:
          type: list(string)
          default: []
          description: Extra docker networks to attach the bundle's main container to (beyond the bundle's defaults). Networks must already exist on the host. Use for cross-bundle integration with sidecars like protonmail-bridge that live in their own bootstrap-tier network.
          ui: advanced

  # ── Steward ─────────────────────────────────────────────────────────────
  # Simplified Authentik admin UI for non-technical org admins. Members of
  # `admin_group_name` (matched against the OIDC `groups` claim) can sign in
  # and manage users + groups without touching Authentik directly. See
  # platform/apps/steward/terraform/variables.tf.
  - id: steward
    display_name: Steward
    category: administration
    description_short: Simplified Authentik admin UI for non-technical org admins
    description: |
      Steward is a focused web UI on top of Authentik's API: invite members,
      manage groups, reset passwords — without the full Authentik admin surface.
      Designed for orgs whose ops team doesn't include Authentik specialists.
    icon: icons/steward.svg
    upstream_url: https://github.com/sheyaln/steward

    config:
      key: steward
      schema:
        enabled:
          type: bool
          default: true
          description: Whether Steward is deployed in this environment.
          ui: hidden


        hostname:
          type: string
          required: true
          description: Public hostname Steward is served at.
          example: members.example.org
          subdomain_default: members
          ui: text
          validation:
            pattern: ^[a-z0-9.-]+\.[a-z]{2,}$

        admin_group_name:
          type: string
          default: steward-admins
          description: Name of the Authentik group whose members can sign in to Steward.
          ui: advanced

        invite_flow_slug:
          type: string
          default: ''
          description: Slug of an Authentik enrollment flow Steward attaches to invitations. Empty disables invitations.
          example: default-source-enrollment
          ui: advanced

        deployment_host_key:
          type: string
          default: tools
          description: Which host (key in compute_hosts) Steward runs on.
          ui: advanced

        authorized_groups:
          type: list(string)
          default: [delegate]
          description: Authentik group names allowed to access this app. Higher tiers nest under lower ones in Authentik, so naming a baseline tier also admits every tier above it. Default [delegate] admits delegates and up — Steward delegates member management to officers.
          ui: advanced

        monitoring_enabled:
          type: bool
          default: true
          description: Wire Steward metrics + dashboards into the monitoring stack.
          ui: advanced

        category_group:
          type: string
          default: Member Operations
          description: Section the app appears under in the Authentik portal.
          ui: advanced

        application_name:
          type: string
          default: Steward
          description: Display name for the Authentik portal entry. Override for branded portals.
          ui: advanced

        application_slug:
          type: string
          default: ""
          description: Override the Authentik application slug. Default empty = use the bundle's stock slug (`steward`). Set to a legacy slug to enable in-place import without force-replace.
          ui: advanced

        dns_zone_override:
          type: string
          default: ""
          description: Override the DNS zone for this app's A record. Default empty derives from hostname suffix matching against base.domains.zones. Set only for edge cases.
          ui: advanced

        icon_filename:
          type: string
          default: steward-icon.png
          description: Icon filename to fetch from base.authentik.icon_base_url. Empty = no icon. Overridden by icon_url (full URL).
          ui: advanced

        icon_url:
          type: string
          default: ""
          description: Full icon URL override. When set, used verbatim and icon_filename is ignored.
          ui: advanced

        extra_env_vars:
          type: map(string)
          default: {}
          description: Map of KEY -> value rendered into the container .env after first-class vars. Use for env-driven feature flags / third-party integrations / debug toggles not exposed first-class on the bundle.
          ui: advanced

        extra_docker_networks:
          type: list(string)
          default: []
          description: Extra docker networks to attach the bundle's main container to (beyond the bundle's defaults). Networks must already exist on the host. Use for cross-bundle integration with sidecars like protonmail-bridge that live in their own bootstrap-tier network.
          ui: advanced

  # ── Vikunja ─────────────────────────────────────────────────────────────
  # Task and project tracker. Single container, postgres-backed, OIDC-only by
  # default. Attachments live on the host at /opt/vikunja/files. See
  # platform/apps/vikunja/terraform/variables.tf.
  - id: vikunja
    display_name: Vikunja
    category: productivity
    description_short: Task and project tracker with SSO
    description: |
      Open-source task and project manager. Lists, kanban, gantt, calendars,
      teams. Federated SSO via Authentik; team membership auto-assigned from
      OIDC group claims when the matching custom scope is enabled.
    icon: icons/vikunja.svg
    docs_url: https://vikunja.io/docs/
    upstream_url: https://vikunja.io/

    config:
      key: vikunja
      schema:
        enabled:
          type: bool
          default: true
          description: Whether Vikunja is deployed in this environment.
          ui: hidden


        hostname:
          type: string
          required: true
          description: Public hostname Vikunja is served at.
          example: tasks.example.org
          subdomain_default: tasks
          ui: text
          validation:
            pattern: ^[a-z0-9.-]+\.[a-z]{2,}$

        timezone:
          type: string
          default: UTC
          description: IANA timezone for reminder and recurring-task scheduling.
          example: America/New_York
          ui: advanced

        enable_registration:
          type: bool
          default: false
          description: Allow Vikunja's built-in local-account registration. OIDC is the default sign-in path; leave off unless you also enable local auth.
          ui: advanced

        enable_local_auth:
          type: bool
          default: false
          description: Allow username+password logins in addition to OIDC. Default off.
          ui: advanced

        smtp_from_email:
          type: string
          default: ''
          description: From-address for outbound mail. Empty disables SMTP.
          example: tasks@example.org
          ui: advanced

        oidc_groups_scope_name:
          type: string
          default: vikunja_scope
          description: Authentik custom-scope name carrying the vikunja_groups team-assignment claim.
          ui: advanced

        deployment_host_key:
          type: string
          default: tools
          description: Which host (key in compute_hosts) Vikunja runs on.
          ui: advanced

        authorized_groups:
          type: list(string)
          default: [member]
          description: Authentik group names allowed to access this app. Higher tiers nest under lower ones in Authentik, so naming a baseline tier also admits every tier above it. Default [member] admits the whole membership.
          ui: advanced

        monitoring_enabled:
          type: bool
          default: true
          description: Wire Vikunja log paths into the monitoring stack.
          ui: advanced

        category_group:
          type: string
          default: Collaboration
          description: Section the app appears under in the Authentik portal.
          ui: advanced

        application_name:
          type: string
          default: Tasks (Vikunja)
          description: Display name for the Authentik portal entry. Override for branded portals.
          ui: advanced

        application_slug:
          type: string
          default: ""
          description: Override the Authentik application slug. Default empty = use the bundle's stock slug (`vikunja`). Set to a legacy slug to enable in-place import without force-replace.
          ui: advanced

        dns_zone_override:
          type: string
          default: ""
          description: Override the DNS zone for this app's A record. Default empty derives from hostname suffix matching against base.domains.zones. Set only for edge cases.
          ui: advanced

        icon_filename:
          type: string
          default: vikunja-icon.png
          description: Icon filename to fetch from base.authentik.icon_base_url. Empty = no icon. Overridden by icon_url (full URL).
          ui: advanced

        icon_url:
          type: string
          default: ""
          description: Full icon URL override. When set, used verbatim and icon_filename is ignored.
          ui: advanced

        extra_env_vars:
          type: map(string)
          default: {}
          description: Map of KEY -> value rendered into the container .env after first-class vars. Use for env-driven feature flags / third-party integrations / debug toggles not exposed first-class on the bundle.
          ui: advanced

        extra_docker_networks:
          type: list(string)
          default: []
          description: Extra docker networks to attach the bundle's main container to (beyond the bundle's defaults). Networks must already exist on the host. Use for cross-bundle integration with sidecars like protonmail-bridge that live in their own bootstrap-tier network.
          ui: advanced

  # ── BentoPDF ────────────────────────────────────────────────────────────
  # Browser-based PDF toolkit (merge, split, OCR, redact). Stateless — no
  # DB, no storage. Authenticated via Authentik forward-auth (the embedded
  # outpost gates every request). See platform/apps/bentopdf/.
  - id: bentopdf
    display_name: BentoPDF
    category: tools
    description_short: Browser PDF toolkit (merge, split, OCR, redact)
    description: |
      Self-hosted PDF toolkit with no server-side state. Authentik's
      embedded outpost gates every request via Traefik forward-auth;
      BentoPDF itself has no auth integration.
    icon: icons/bentopdf.svg
    upstream_url: https://github.com/digital-blueprint/bento-pdf

    config:
      key: bentopdf
      schema:
        enabled:
          type: bool
          default: true
          description: Whether BentoPDF is deployed in this environment.
          ui: hidden

        hostname:
          type: string
          required: true
          description: Public hostname BentoPDF is served at.
          example: pdf.example.org
          subdomain_default: pdf
          ui: text
          validation:
            pattern: ^[a-z0-9.-]+\.[a-z]{2,}$

        deployment_host_key:
          type: string
          default: tools
          description: Which host (key in compute_hosts) BentoPDF runs on.
          ui: advanced

        authorized_groups:
          type: list(string)
          default: [member]
          description: Authentik group names allowed to access this app. Higher tiers nest under lower ones in Authentik, so naming a baseline tier also admits every tier above it. Default [member] admits the whole membership.
          ui: advanced

        monitoring_enabled:
          type: bool
          default: true
          description: Wire BentoPDF log paths into the monitoring stack.
          ui: advanced

        category_group:
          type: string
          default: Collaboration
          description: Section the app appears under in the Authentik portal.
          ui: advanced

        application_name:
          type: string
          default: PDF Tools (BentoPDF)
          description: Display name for the Authentik portal entry. Override for branded portals.
          ui: advanced

        application_slug:
          type: string
          default: ""
          description: Override the Authentik application slug. Default empty = use the bundle's stock slug (`bentopdf`). Set to a legacy slug to enable in-place import without force-replace.
          ui: advanced

        dns_zone_override:
          type: string
          default: ""
          description: Override the DNS zone for this app's A record. Default empty derives from hostname suffix matching against base.domains.zones. Set only for edge cases.
          ui: advanced

        icon_filename:
          type: string
          default: bentopdf-icon.png
          description: Icon filename to fetch from base.authentik.icon_base_url. Empty = no icon. Overridden by icon_url (full URL).
          ui: advanced

        icon_url:
          type: string
          default: ""
          description: Full icon URL override. When set, used verbatim and icon_filename is ignored.
          ui: advanced

  # ── Broadsheet ──────────────────────────────────────────────────────────
  # Newsletters + transactional email (sabokit-broadsheet fork of notifuse).
  # OIDC via Authentik. Stateful: SECRET_KEY is immutable after first apply
  # (encrypts every workspace secret). Defaults to admin-only access.
  # See platform/apps/broadsheet/.
  - id: broadsheet
    display_name: Broadsheet
    category: productivity
    description_short: Newsletters + transactional email (sabokit-broadsheet fork)
    description: |
      Self-hosted newsletters + transactional email manager. Sabokit-broadsheet
      is a maintained fork of notifuse carrying OIDC patches and rebranded UI;
      same SendGrid/Mailjet-class delivery engine. Federated SSO via Authentik
      with magic-link fallback.
    icon: icons/broadsheet.svg
    upstream_url: https://github.com/sheyaln/sabokit-broadsheet

    config:
      key: broadsheet
      schema:
        enabled:
          type: bool
          default: true
          description: Whether Broadsheet is deployed in this environment.
          ui: hidden


        hostname:
          type: string
          required: true
          description: Public hostname Broadsheet is served at.
          example: email.example.org
          subdomain_default: email
          ui: text
          validation:
            pattern: ^[a-z0-9.-]+\.[a-z]{2,}$

        root_admin_email:
          type: string
          required: true
          description: Email for the initial root admin. Used both as ROOT_EMAIL identity and ROOT_ADMIN_EMAIL bootstrap login. Password is auto-generated and stored in the app-secrets bag.
          example: ops@example.org
          ui: text

        smtp_from_email:
          type: string
          default: ''
          description: From-address for outbound mail. Empty disables SMTP (Broadsheet won't be able to send).
          example: notify@example.org
          ui: text

        oidc_auto_provision:
          type: bool
          default: true
          description: Auto-create a Broadsheet user on first OIDC login.
          ui: advanced

        oidc_allow_magic_code:
          type: bool
          default: false
          description: Allow magic-link login fallback alongside OIDC. Recommended on so admins can recover if OIDC breaks.
          ui: advanced

        deployment_host_key:
          type: string
          default: tools
          description: Which host (key in compute_hosts) Broadsheet runs on.
          ui: advanced

        authorized_groups:
          type: list(string)
          default: [delegate]
          description: Authentik group names allowed to access this app. Higher tiers nest under lower ones in Authentik, so naming a baseline tier also admits every tier above it. Default [delegate] admits delegates and up — Broadsheet sends mass email.
          ui: advanced

        monitoring_enabled:
          type: bool
          default: true
          description: Wire Broadsheet log paths into the monitoring stack.
          ui: advanced

        category_group:
          type: string
          default: Member Engagement
          description: Section the app appears under in the Authentik portal.
          ui: advanced

        application_name:
          type: string
          default: Broadsheet
          description: Display name for the Authentik portal entry. Override for branded portals.
          ui: advanced

        application_slug:
          type: string
          default: ""
          description: Override the Authentik application slug. Default empty = use the bundle's stock slug (`broadsheet`). Set to a legacy slug to enable in-place import without force-replace.
          ui: advanced

        bucket_name_override:
          type: string
          default: ""
          description: Override the Scaleway object bucket name. Use to import a legacy bucket without force-replace. Drop once data is migrated to the canonical naming pattern.
          ui: advanced

        dns_zone_override:
          type: string
          default: ""
          description: Override the DNS zone for this app's A record. Default empty derives from hostname suffix matching against base.domains.zones. Set only for edge cases.
          ui: advanced

        icon_filename:
          type: string
          default: broadsheet-icon.png
          description: Icon filename to fetch from base.authentik.icon_base_url. Empty = no icon. Overridden by icon_url (full URL).
          ui: advanced

        icon_url:
          type: string
          default: ""
          description: Full icon URL override. When set, used verbatim and icon_filename is ignored.
          ui: advanced

        build_from_source:
          type: bool
          default: false
          description: Opt-in. Build the broadsheet image on the host from image_source_repo instead of pulling. For unreleased fork patches only.
          ui: advanced

        image_source_repo:
          type: string
          default: https://github.com/sheyaln/sabokit-broadsheet.git
          description: Git URL cloned when build_from_source = true.
          ui: advanced

        image_source_ref:
          type: string
          default: main
          description: Git ref (branch, tag, or SHA) checked out when building from source. Pin to a tag/SHA for reproducibility.
          ui: advanced

        extra_env_vars:
          type: map(string)
          default: {}
          description: Map of KEY -> value rendered into the container .env after first-class vars. Use for env-driven feature flags / third-party integrations / debug toggles not exposed first-class on the bundle.
          ui: advanced

        extra_docker_networks:
          type: list(string)
          default: []
          description: Extra docker networks to attach the bundle's main container to (beyond the bundle's defaults). Networks must already exist on the host. Use for cross-bundle integration with sidecars like protonmail-bridge that live in their own bootstrap-tier network.
          ui: advanced

  # ── Privacy policy ──────────────────────────────────────────────────────
  # Public static page. No Authentik integration — privacy policies must be
  # reachable without login. Consumer provides HTML + logo via the Ansible
  # role vars; the bundle ships a placeholder otherwise.
  - id: privacy-policy
    display_name: Privacy Policy
    category: compliance
    description_short: Public static privacy policy page
    description: |
      Single nginx container serving your privacy policy at a stable URL.
      No auth. Consumer authors HTML + (optionally) a logo; the bundle
      handles TLS, DNS, and deploy.

    config:
      key: privacy_policy
      schema:
        enabled:
          type: bool
          default: true
          description: Whether the page is deployed.
          ui: hidden

        hostname:
          type: string
          required: true
          description: Public hostname the page is served at.
          example: privacy.example.org
          subdomain_default: privacy
          ui: text
          validation:
            pattern: ^[a-z0-9.-]+\.[a-z]{2,}$

        page_title:
          type: string
          default: Privacy Policy
          description: Browser tab title (used only by the placeholder; ignored once you supply your own HTML).
          ui: advanced

        deployment_host_key:
          type: string
          default: tools
          description: Which host (key in compute_hosts) the page runs on.
          ui: advanced

        monitoring_enabled:
          type: bool
          default: true
          description: Wire access log paths into the monitoring stack.
          ui: advanced

        dns_zone_override:
          type: string
          default: ""
          description: Override the DNS zone for this app's A record. Default empty derives from hostname suffix matching against base.domains.zones. Set only for edge cases.
          ui: advanced

        extra_docker_networks:
          type: list(string)
          default: []
          description: Extra docker networks to attach the bundle's main container to (beyond the bundle's defaults). Networks must already exist on the host. Use for cross-bundle integration with sidecars like protonmail-bridge that live in their own bootstrap-tier network.
          ui: advanced

  # ── Nextcloud ───────────────────────────────────────────────────────────
  # File sync + collaboration. Multi-container (Nextcloud + Redis), postgres,
  # S3 as primary storage. Pin image_tag to a major — Nextcloud only supports
  # one-major-at-a-time upgrades.
  - id: nextcloud
    display_name: Nextcloud
    category: collaboration
    description_short: File sync + collaboration suite
    description: |
      Self-hosted file sync, calendar, contacts, document collaboration.
      Federated SSO via Authentik. Files stored in S3 (object storage as
      primary); local volume only holds the PHP install + apps.
    icon: icons/nextcloud.svg
    upstream_url: https://nextcloud.com/

    config:
      key: nextcloud
      schema:
        enabled:
          type: bool
          default: true
          description: Whether Nextcloud is deployed.
          ui: hidden


        hostname:
          type: string
          required: true
          description: Public hostname Nextcloud is served at.
          example: cloud.example.org
          subdomain_default: cloud
          ui: text
          validation:
            pattern: ^[a-z0-9.-]+\.[a-z]{2,}$

        onlyoffice_hostname:
          type: string
          required: true
          description: Public hostname OnlyOffice Document Server is served at. The browser loads the editor from this URL so it must be reachable from clients.
          example: docs.example.org
          subdomain_default: docs
          ui: text
          validation:
            pattern: ^[a-z0-9.-]+\.[a-z]{2,}$

        talk_hostname:
          type: string
          required: true
          description: Public hostname Talk HPB signaling is served at over WSS. Same name resolves the eturnal TURN server on UDP/TCP 3478. Security group must allow 3478 + UDP 49152-49252.
          example: talk.example.org
          subdomain_default: talk
          ui: text
          validation:
            pattern: ^[a-z0-9.-]+\.[a-z]{2,}$

        smtp_from_email:
          type: string
          default: ''
          description: From-address for transactional email. Empty disables SMTP.
          example: cloud@example.org
          ui: advanced

        default_phone_region:
          type: string
          default: US
          description: ISO 3166-1 alpha-2 country code for phone-number defaults.
          ui: advanced

        admin_username:
          type: string
          default: ncadmin
          description: Bootstrap admin username (OIDC users sign in separately).
          ui: advanced

        max_upload_size_bytes:
          type: number
          default: 2147483648
          description: Maximum upload size in bytes. Apache body limit set to match.
          ui: advanced

        deployment_host_key:
          type: string
          default: tools
          description: Which host (key in compute_hosts) Nextcloud runs on.
          ui: advanced

        authorized_groups:
          type: list(string)
          default: [member]
          description: Authentik group names allowed to access this app. Higher tiers nest under lower ones in Authentik, so naming a baseline tier also admits every tier above it. Default [member] admits the whole membership.
          ui: advanced

        monitoring_enabled:
          type: bool
          default: true
          description: Wire Nextcloud log paths into the monitoring stack.
          ui: advanced

        category_group:
          type: string
          default: Collaboration
          description: Section the app appears under in the Authentik portal.
          ui: advanced

        application_name:
          type: string
          default: Nextcloud
          description: Display name for the Authentik portal entry. Override for branded portals.
          ui: advanced

        application_slug:
          type: string
          default: ""
          description: Override the Authentik application slug. Default empty = use the bundle's stock slug (`nextcloud`). Set to a legacy slug to enable in-place import without force-replace.
          ui: advanced

        bucket_name_override:
          type: string
          default: ""
          description: Override the Scaleway object bucket name. Use to import a legacy bucket without force-replace. Drop once data is migrated to the canonical naming pattern.
          ui: advanced

        dns_zone_override:
          type: string
          default: ""
          description: Override the DNS zone for all three Nextcloud A records (nextcloud, onlyoffice, talk). Default empty derives each independently from its hostname by suffix matching against base.domains.zones. Set only for edge cases.
          ui: advanced

        icon_filename:
          type: string
          default: nextcloud-icon.png
          description: Icon filename to fetch from base.authentik.icon_base_url. Empty = no icon. Overridden by icon_url (full URL).
          ui: advanced

        icon_url:
          type: string
          default: ""
          description: Full icon URL override. When set, used verbatim and icon_filename is ignored.
          ui: advanced

        instance_name:
          type: string
          default: Nextcloud
          description: User-facing instance name (browser tab, email headers, mobile clients). Override for branded deployments (e.g. "Acme Cloud").
          ui: advanced

        maintenance_window_start:
          type: number
          default: 2
          description: UTC hour (0-23) when Nextcloud runs its nightly background-job window. Pick a low-traffic hour for your user base.
          ui: advanced

        enabled_apps:
          type: list(string)
          default: [groupfolders, notify_push, notes, tasks, forms, polls, epubviewer, webhook_listeners]
          description: Nextcloud apps the post-install script auto-installs and enables on every run. Default set turns Nextcloud into a full collaboration suite.
          ui: advanced

        disabled_apps:
          type: list(string)
          default: [photos]
          description: Nextcloud apps the post-install script disables on every run. Default disables `photos` (heavy thumbnail jobs).
          ui: advanced

        n8n_form_webhook_url:
          type: string
          default: ""
          description: Optional URL of an n8n webhook receiver for Nextcloud Forms submissions. Requires `webhook_listeners` in enabled_apps.
          ui: advanced

        onlyoffice_image_tag:
          type: string
          default: "latest"
          description: OnlyOffice Document Server image tag. Bumping versions is generally safe.
          ui: advanced

        onlyoffice_memory_limit:
          type: string
          default: "2G"
          description: Memory ceiling for OnlyOffice Document Server. Below ~1.5G, large-file conversions OOM mid-edit.
          ui: advanced

        onlyoffice_cpu_limit:
          type: string
          default: "2.0"
          description: CPU ceiling for OnlyOffice Document Server.
          ui: advanced

        talk_image_tag:
          type: string
          default: "latest"
          description: Tag for the ghcr.io/nextcloud-releases/aio-talk image. Bundles eturnal/Janus/signaling — treat as one moving target.
          ui: advanced

        talk_turn_port:
          type: number
          default: 3478
          description: Public TCP/UDP port for the bundled eturnal TURN server. 3478 is the IANA TURN port.
          ui: advanced

        talk_relay_port_min:
          type: number
          default: 49152
          description: Lower bound of the UDP port range eturnal allocates for media relay. Must be open in the security group.
          ui: advanced

        talk_relay_port_max:
          type: number
          default: 49252
          description: Upper bound of the UDP relay range. Keep tight (101 ports handles small-org video).
          ui: advanced

        talk_memory_limit:
          type: string
          default: "1G"
          description: Memory ceiling for the Talk HPB container.
          ui: advanced

        talk_cpu_limit:
          type: string
          default: "1.0"
          description: CPU ceiling for the Talk HPB container. WebRTC media doesn't pass through once peers connect.
          ui: advanced

        extra_env_vars:
          type: map(string)
          default: {}
          description: Map of KEY -> value rendered into the container .env after first-class vars. Use for env-driven feature flags / third-party integrations / debug toggles not exposed first-class on the bundle.
          ui: advanced

        extra_docker_networks:
