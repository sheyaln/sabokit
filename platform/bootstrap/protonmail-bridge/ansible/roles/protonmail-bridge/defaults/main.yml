---
protonmail_bridge_image: "shenxn/protonmail-bridge"
protonmail_bridge_image_tag: "latest"
protonmail_bridge_install_dir: "/opt/protonmail-bridge"

# The shared docker network apps join to reach the bridge by hostname.
# Apps that send mail must also be on this network OR the bridge must be
# joined to whatever per-app network they use. For most consumers,
# letting apps join `protonmail-bridge-net` is the simpler path.
protonmail_bridge_network: "protonmail-bridge-net"

protonmail_bridge_timezone: "UTC"

protonmail_bridge_memory_limit: "256M"
protonmail_bridge_memory_reservation: "64M"
protonmail_bridge_cpu_limit: "0.5"
protonmail_bridge_cpu_reservation: "0.05"

protonmail_bridge_diun_watch_enabled: false
protonmail_bridge_autoheal_enabled: true

# Filesystem owner/group for /opt/<slug>/ artifacts (compose file, .env).
# Defaults to the deploy user (ubuntu on stock cloud images) so the role
# doesn't leave the install dir root-owned. The deploy user is already in
# the docker group via the base/docker role and can therefore run
# `docker compose` against the rendered files without escalation.
protonmail_bridge_file_owner: "ubuntu"
protonmail_bridge_file_group: "ubuntu"
protonmail_bridge_extra_env_vars: {}

# Extra docker networks attached to the protonmail-bridge container alongside the bundle's
# traefik network. Networks must already exist on the host (created by whichever
# bundle owns them) and are declared `external: true` in compose.
protonmail_bridge_extra_docker_networks: []

