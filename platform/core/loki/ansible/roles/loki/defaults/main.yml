---
loki_image: "grafana/loki"
loki_image_tag: "latest"
loki_install_dir: "/opt/loki"

loki_retention: "744h"
loki_ingestion_rate_mb: 10
loki_ingestion_burst_size_mb: 20
loki_private_ip_bind: ""

loki_memory_limit: "1G"
loki_memory_reservation: "256M"
loki_cpu_limit: "1.0"
loki_cpu_reservation: "0.25"

loki_timezone: "UTC"
loki_internal_network: "monitoring_internal"

loki_diun_watch_enabled: true
loki_autoheal_enabled: true

# Filesystem owner/group for /opt/<slug>/ artifacts (compose file, .env).
# Defaults to the deploy user (ubuntu on stock cloud images) so the role
# doesn't leave the install dir root-owned. The deploy user is already in
# the docker group via the base/docker role and can therefore run
# `docker compose` against the rendered files without escalation.
loki_file_owner: "ubuntu"
loki_file_group: "ubuntu"
loki_extra_env_vars: {}

# Extra docker networks attached to the loki container alongside the bundle's
# traefik network. Networks must already exist on the host (created by whichever
# bundle owns them) and are declared `external: true` in compose.
loki_extra_docker_networks: []

