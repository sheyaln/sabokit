---
# Bootstrap the prereqs every host needs before any app can deploy. Run once
# per fresh host. Re-run only when bootstrap config changes (rare).
#
# Tagged `bootstrap` so consumers can `ansible-playbook site.yml --skip-tags
# bootstrap` for fast app-only redeploys.

- name: Bootstrap all hosts
  hosts: all
  become: true
  tags: [bootstrap]
  roles:
    - role: log-management
    - role: unattended-upgrades
    - role: ufw
    # split-dns must land before docker so dnsmasq owns :53 by the time
    # the docker daemon starts binding its bridge. Role end_play's when
    # split_dns_overrides is empty (single-host deployments).
    - role: split-dns
      vars:
        split_dns_overrides: "{{ split_dns_overrides | default({}) }}"
    - role: docker
    - role: fail2ban

- name: Bootstrap application hosts (Traefik + secrets + monitoring agent)
  hosts: apps
  become: true
  tags: [bootstrap]
  roles:
    - role: traefik
      vars:
        traefik_acme_email: "{{ traefik_acme_email }}"
        traefik_authentik_outpost_url: "https://{{ gateway_domain }}/outpost.goauthentik.io/auth/traefik"

    - role: scw-secrets
      vars:
        scw_secrets_project_id: "{{ scaleway_project_id }}"

    - role: monitoring-agent
      vars:
        monitoring_host_label: "{{ inventory_hostname }}"
        monitoring_environment: "{{ env_name | default('prod') }}"
        # monitoring_loki_push_url comes through as an extra-var when set;
        # role default ("") handles the unset case. A self-referencing line
        # ({{ monitoring_loki_push_url | default('') }}) tripped Ansible's
        # template recursion guard, so we let the precedence chain handle it.

# Identity-host install: runs Authentik server on hosts in the [identity]
# inventory group. For single-VM setups (e.g. staging), the same host can be
# in both [apps] and [identity] groups — Ansible runs each play independently.
- name: Install Authentik server on identity hosts
  hosts: identity
  become: true
  tags: [bootstrap, authentik-server]
  roles:
    - role: authentik-server
      vars:
        authentik_hostname: "{{ gateway_domain }}"
        # `authentik_legacy_hostname` consumed directly from playbook extra-vars
        # (cannot self-reference). Defaults to empty in role defaults.
        authentik_postgres_secret_id: "{{ identity_bootstrap.postgres_secret_id }}"
        authentik_admin_secret_id: "{{ identity_bootstrap.admin_secret_id }}"
        authentik_server_secret_id: "{{ identity_bootstrap.server_secret_id }}"
        authentik_media_s3_secret_id: "{{ identity_bootstrap.media_s3_secret_id | default('') }}"
        authentik_smtp_secret_id: "{{ identity_bootstrap.smtp_secret_id | default('') }}"
