  become: true
  gather_facts: false
  tags: [down, backrest]
  tasks:
    - name: Stop and remove each backrest instance
      community.docker.docker_compose_v2:
        project_src: "/opt/backrest-{{ inst.key }}"
        state: absent
      loop: "{{ (enabled_apps.backrest | default({})).instances | default({}) | dict2items | selectattr('value.ansible_group', 'in', group_names) | list }}"
      loop_control:
        loop_var: inst
        label: "{{ inst.key }}"
      ignore_errors: true  # compose file may already be gone
      when: enabled_apps.backrest is defined
            and enabled_apps.backrest.instances is defined
