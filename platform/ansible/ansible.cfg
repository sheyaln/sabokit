[defaults]
# Roles live next to the bundles they belong to. This roles_path picks
# them up wherever they are without forcing them all under one tree.
roles_path = ../base/ansible/roles:../identity/ansible/roles:../apps/outline/ansible/roles
# identity's roles_path picks up authentik-server (installs the Authentik
# container stack on hosts in the `identity` ansible group).
# When new apps ship, append their roles dir here (or symlink them).

host_key_checking = False
retry_files_enabled = False
forks = 10
# Use the bundled default callback with YAML result formatting. The old
# community.general.yaml callback was removed in community.general 12.0.
stdout_callback = default
result_format = yaml
# collections_path intentionally unset — Ansible searches the standard
# locations (~/.ansible/collections + /usr/share/ansible/collections). A
# relative override here would resolve from the consumer's cwd, not from
# this file's location.

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
