---
# Full deploy: bootstrap (if not skipped) followed by every enabled app.
#
# Common invocations:
#   ansible-playbook site.yml                          # full bootstrap + apps
#   ansible-playbook site.yml --skip-tags bootstrap    # apps only (fast redeploy)
#   ansible-playbook site.yml --tags outline           # just one app + its bootstrap prereqs
#   ansible-playbook site.yml --tags apps              # all apps, skip bootstrap

- import_playbook: bootstrap.yml
- import_playbook: host-services.yml
- import_playbook: apps.yml
