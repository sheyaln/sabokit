---
# Full deploy: bootstrap → host-services → core-tier monitoring → every enabled app.
#
# Common invocations:
#   ansible-playbook site.yml                          # full bootstrap + host-services + core + apps
#   ansible-playbook site.yml --skip-tags bootstrap    # host-services + core + apps only (fast redeploy)
#   ansible-playbook site.yml --tags outline           # just one app + its bootstrap prereqs
#   ansible-playbook site.yml --tags apps              # all apps, skip bootstrap + host-services + core
#   ansible-playbook site.yml --tags host-services     # diun + autoheal + wazuh-agent only
#   ansible-playbook site.yml --tags core              # core-tier only (loki, prometheus, grafana, wazuh)

- import_playbook: bootstrap.yml
- import_playbook: host-services.yml
- import_playbook: core.yml
- import_playbook: apps.yml
