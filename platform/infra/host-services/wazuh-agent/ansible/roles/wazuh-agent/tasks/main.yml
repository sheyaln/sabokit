---
# Deploy Wazuh agent as a host-network container. Auto-enrolls against the
# manager via the WAZUH_MANAGER_SERVER env var. Re-running with a different
# wazuh_agent_name creates a NEW agent record on the manager — keep stable.

- name: Validate required vars
  ansible.builtin.assert:
    that:
      - wazuh_agent_name | length > 0
      - wazuh_agent_manager_address | length > 0
      - wazuh_agent_registration_secret_id | length > 0
    fail_msg: "wazuh_agent_name, wazuh_agent_manager_address, and wazuh_agent_registration_secret_id are required (the manager requires a password on enrollment)."

# Enrollment password. Fetched from the manager bundle's app-secrets bag and
# presented to authd on the 1515 port; the manager runs use_password=yes.
- name: Normalize registration secret ID
  ansible.builtin.set_fact:
    _wazuh_agent_registration_secret_uuid: "{{ wazuh_agent_registration_secret_id | regex_replace('^[^/]+/', '') }}"
  tags: [secrets]

- name: Look up agent enrollment password from Scaleway
  ansible.builtin.set_fact:
    wazuh_agent_registration_password: "{{ (lookup('scaleway.scaleway.scaleway_secret', _wazuh_agent_registration_secret_uuid) | b64decode | from_json).WAZUH_AUTHD_PASSWORD }}"
  no_log: true
  tags: [secrets]

- name: Assert Docker is installed and running
  ansible.builtin.command: docker info
  register: wazuh_agent_docker_check
  changed_when: false
  failed_when: wazuh_agent_docker_check.rc != 0

- name: Ensure agent directory
  ansible.builtin.file:
    path: "{{ wazuh_agent_install_dir }}"
    state: directory
    mode: "0755"

# ── FIM: host-side auditd rules ─────────────────────────────────────────────
# Wazuh's FIM ingests events from the host's auditd. The agent container
# tails /var/log/audit/audit.log via bind-mount; the rules themselves must
# be loaded into the HOST kernel (auditd is a host service, not container).
- name: FIM — detect host auditd
  ansible.builtin.stat:
    path: /etc/audit/rules.d
  register: wazuh_agent_auditd_dir
  when: wazuh_agent_fim_enabled | default(true)

- name: FIM — render audit rules
  ansible.builtin.template:
    src: audit.rules.j2
    dest: /etc/audit/rules.d/wazuh.rules
    owner: root
    group: root
    mode: "0640"
  when:
    - wazuh_agent_fim_enabled | default(true)
    - wazuh_agent_auditd_dir.stat.exists | default(false)
  notify: Reload auditd

- name: FIM — render ossec.conf override
  ansible.builtin.template:
    src: ossec.conf.j2
    dest: "{{ wazuh_agent_install_dir }}/ossec.conf"
    mode: "0644"
  when: wazuh_agent_fim_enabled | default(true)
  notify: Restart wazuh-agent

- name: FIM — warn when auditd is missing
  ansible.builtin.debug:
    msg: |
      auditd not installed on this host (/etc/audit/rules.d missing).
      Wazuh syscheck will still run, but auditd-sourced events
      (-w … -p wa -k …) will not be generated. Install auditd to enable
      full FIM: `apt-get install -y auditd`.
  when:
    - wazuh_agent_fim_enabled | default(true)
    - not (wazuh_agent_auditd_dir.stat.exists | default(false))

# ── Container ──────────────────────────────────────────────────────────────
- name: Render env (enrollment password for compose interpolation)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ wazuh_agent_install_dir }}/.env"
    mode: "0600"
  no_log: true
  notify: Restart wazuh-agent
  tags: [secrets]

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ wazuh_agent_install_dir }}/docker-compose.yml"
    mode: "0644"
  notify: Restart wazuh-agent

- name: Ensure agent is running
  community.docker.docker_compose_v2:
    project_src: "{{ wazuh_agent_install_dir }}"
    state: present
    pull: missing
