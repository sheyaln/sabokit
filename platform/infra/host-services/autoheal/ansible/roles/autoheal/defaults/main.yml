---
autoheal_image: "willfarrell/autoheal"
autoheal_image_tag: "latest"

autoheal_install_dir: "/opt/autoheal"

autoheal_container_label: "autoheal"
autoheal_interval_seconds: 5
autoheal_start_period_seconds: 60
autoheal_timezone: "UTC"

# Resource limits — autoheal is tiny.
autoheal_memory_limit: "128M"
autoheal_memory_reservation: "16M"
autoheal_cpu_limit: "0.25"
autoheal_cpu_reservation: "0.02"

# Filesystem owner/group for /opt/<slug>/ artifacts (compose file, .env).
# Defaults to the deploy user (ubuntu on stock cloud images) so the role
# doesn't leave the install dir root-owned. The deploy user is already in
# the docker group via the base/docker role and can therefore run
# `docker compose` against the rendered files without escalation.
autoheal_file_owner: "ubuntu"
autoheal_file_group: "ubuntu"
