---
# Deploy Diun as a one-container docker-compose stack. Reads
# /var/run/docker.sock to inspect sibling containers and look up their
# image references, then polls each image's upstream registry on the
# configured schedule. Notifies when a tag's digest changes.
#
# Required vars: none. All have sensible defaults; consumer overrides via
# platform/apps/diun/terraform vars.

- name: Assert Docker is installed and running
  ansible.builtin.command: docker info
  register: diun_docker_check
  changed_when: false
  failed_when: diun_docker_check.rc != 0

- name: Ensure Diun directory
  ansible.builtin.file:
    path: "{{ diun_install_dir }}"
    state: directory
    mode: "0750"
    owner: "{{ diun_file_owner }}"
    group: "{{ diun_file_group }}"

- name: Ensure Diun data directory
  ansible.builtin.file:
    path: "{{ diun_install_dir }}/data"
    state: directory
    mode: "0750"
    owner: "{{ diun_file_owner }}"
    group: "{{ diun_file_group }}"

- name: Render diun.yml
  ansible.builtin.template:
    src: diun.yml.j2
    dest: "{{ diun_install_dir }}/diun.yml"
    mode: "0640"
    owner: "{{ diun_file_owner }}"
    group: "{{ diun_file_group }}"
  notify: Restart diun

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ diun_install_dir }}/docker-compose.yml"
    mode: "0644"
    owner: "{{ diun_file_owner }}"
    group: "{{ diun_file_group }}"
  notify: Restart diun

- name: Ensure Diun is running
  community.docker.docker_compose_v2:
    project_src: "{{ diun_install_dir }}"
    state: present
    pull: missing
