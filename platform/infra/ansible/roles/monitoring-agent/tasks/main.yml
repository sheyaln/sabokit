---
# Deploys the per-host monitoring agents:
#   - node-exporter   (Prometheus system metrics)
#   - cAdvisor        (Prometheus container metrics)
#   - Grafana Alloy   (log + metrics shipper; defaults to forwarding logs to Loki)
#
# Firewall rules opening the exporter ports are OFF by default. Set
# `monitoring_scraper_cidrs` (a list of CIDRs allowed to scrape) to have the
# role drop UFW allow rules for the metrics ports. On hosts running UFW with
# default-deny inbound, you MUST either configure this list or open the ports
# manually — otherwise the central scraper cannot reach the exporters.

- name: Assert required variables
  ansible.builtin.assert:
    that:
      - monitoring_host_label | length > 0
    fail_msg: "monitoring_host_label is REQUIRED — used to label every metric/log this host emits."

- name: Open exporter ports to scraper CIDRs
  community.general.ufw:
    rule: allow
    port: "{{ item.0 | string }}"
    proto: tcp
    from_ip: "{{ item.1 }}"
    comment: "monitoring-agent {{ item.0 }} from {{ item.1 }}"
  loop: "{{ monitoring_agent_exporter_ports | product(monitoring_scraper_cidrs) | list }}"
  loop_control:
    label: "{{ item.0 }} <- {{ item.1 }}"
  when: monitoring_scraper_cidrs | length > 0
  failed_when: false   # UFW may not be installed; that's fine.

- name: Create exporters directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ monitoring_agent_owner }}"
    group: "{{ monitoring_agent_owner }}"
  loop:
    - "{{ monitoring_agent_dir }}"
    - "{{ monitoring_agent_alloy_config_dir }}"

- name: Create node-exporter textfile collector directory
  ansible.builtin.file:
    path: "{{ monitoring_agent_textfile_collector_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ monitoring_agent_owner }}"
    group: "{{ monitoring_agent_owner }}"

- name: Ensure monitoring network exists
  community.docker.docker_network:
    name: "{{ monitoring_agent_network }}"
    state: present
    driver: bridge

# Alloy joins these to scrape app containers by name. Normally already created
# by the traefik role earlier in the same play; ensured here so a missing net
# can't fail `docker compose up` on its external reference. Plain bridge, same
# as traefik makes it, so this stays a no-op when it exists.
- name: Ensure app networks exist
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
    driver: bridge
  loop: "{{ monitoring_agent_app_networks }}"

- name: Render Alloy configuration
  ansible.builtin.template:
    src: alloy-config.alloy.j2
    dest: "{{ monitoring_agent_alloy_config_dir }}/config.alloy"
    mode: '0644'
    owner: "{{ monitoring_agent_owner }}"
    group: "{{ monitoring_agent_owner }}"

- name: Render docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_agent_dir }}/docker-compose.yml"
    mode: '0644'
    owner: "{{ monitoring_agent_owner }}"
    group: "{{ monitoring_agent_owner }}"

- name: Render environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ monitoring_agent_dir }}/.env"
    mode: '0600'
    owner: "{{ monitoring_agent_owner }}"
    group: "{{ monitoring_agent_owner }}"

- name: Stop existing monitoring-agent stack
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_agent_dir }}"
    state: absent
    remove_orphans: true
  ignore_errors: true

- name: Deploy monitoring-agent stack
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_agent_dir }}"
    state: present
    pull: always

# Exporters aren't host-published (Alloy scrapes them over the shared docker
# network), so verify them inside their containers rather than on a host port.
- name: Verify node-exporter is serving metrics
  ansible.builtin.command: >-
    docker exec node-exporter wget -q -O /dev/null
    http://127.0.0.1:{{ node_exporter_port }}/metrics
  changed_when: false
  register: node_exporter_check
  retries: 6
  delay: 5
  until: node_exporter_check.rc == 0

- name: Verify cAdvisor is serving metrics
  ansible.builtin.command: >-
    docker exec cadvisor wget -q -O /dev/null
    http://127.0.0.1:{{ cadvisor_port }}/metrics
  changed_when: false
  register: cadvisor_check
  retries: 6
  delay: 5
  until: cadvisor_check.rc == 0

- name: Verify Alloy is ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ alloy_port }}/ready"
    method: GET
    return_content: false
  register: alloy_check
  retries: 5
  delay: 5
  until: alloy_check.status == 200
  when: monitoring_agent_enable_alloy | bool
