---
# Detect whether docker is already installed (e.g. the host booted from a
# pre-baked fc-base image). When present we skip the apt repo + install steps;
# the role still needs to render the daemon config, start the service, and
# manage the docker group, so those steps run unconditionally below.
- name: Check for existing docker binary
  ansible.builtin.command: docker --version
  register: docker_present_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Set docker_pre_installed fact
  ansible.builtin.set_fact:
    docker_pre_installed: "{{ docker_present_check.rc == 0 }}"

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  when: not docker_pre_installed

- name: Add Docker apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: not docker_pre_installed

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  when: not docker_pre_installed

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else
                   'arm64' if ansible_facts['architecture'] == 'aarch64' else ansible_facts['architecture'] }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_facts['lsb']['codename'] }} stable
    filename: docker
    state: present
  when: not docker_pre_installed

- name: Install Docker and dependencies
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - python3-docker
    state: present
    update_cache: true
  when: not docker_pre_installed

- name: Configure Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  notify: Restart docker

- name: Start Docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Add deploy user to docker group
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups:
      - docker
    append: true
  when: docker_user | length > 0

- name: Wait for Docker daemon to be ready
  ansible.builtin.wait_for:
    path: /var/run/docker.sock
    timeout: 60

- name: Verify Docker is working
  ansible.builtin.command: docker info
  become: true
  become_user: "{{ docker_user }}"
  register: docker_info
  changed_when: false
  retries: 3
  delay: 5
  when: docker_user | length > 0
