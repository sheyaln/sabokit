---
# Deploy Vikunja as a docker-compose stack. Secrets are pulled from Scaleway
# Secret Manager at deploy time and rendered into /opt/vikunja/.env (mode 0600).
#
# Required vars:
#   vikunja_hostname                  - full hostname
#   vikunja_app_secret_id             - Scaleway secret ID for the app's secret bag
#   vikunja_db_credentials_secret_id  - Scaleway secret ID for DB credentials
#
# Prereqs (NOT installed by this role — see platform/ansible/bootstrap.yml):
#   - Docker engine + compose plugin
#   - Traefik on an external network named per vikunja_traefik_docker_network
#   - scaleway.scaleway Ansible collection on the controller (for the lookup)

- name: Validate required Vikunja variables
  ansible.builtin.assert:
    that:
      - vikunja_hostname | length > 0
      - vikunja_app_secret_id | length > 0
      - vikunja_db_credentials_secret_id | length > 0
    fail_msg: "vikunja_hostname, vikunja_app_secret_id and vikunja_db_credentials_secret_id are required."

- name: Assert Docker is installed and running
  ansible.builtin.command: docker info
  register: vikunja_docker_check
  changed_when: false
  failed_when: vikunja_docker_check.rc != 0
  # If this fails, run platform/ansible/bootstrap.yml first.

- name: Assert Traefik external network exists
  community.docker.docker_network_info:
    name: "{{ vikunja_traefik_docker_network }}"
  register: vikunja_traefik_net
  failed_when: not vikunja_traefik_net.exists
  # If this fails, the traefik role from platform/ansible/bootstrap.yml hasn't run.

- name: Ensure Vikunja directory tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ vikunja_file_owner }}"
    group: "{{ vikunja_file_group }}"
  loop:
    - "{{ vikunja_install_dir }}"
    - "{{ vikunja_files_dir }}"

- name: Normalize Scaleway secret IDs (strip leading region/ prefix)
  ansible.builtin.set_fact:
    _vikunja_app_secret_uuid: "{{ vikunja_app_secret_id | regex_replace('^[^/]+/', '') }}"
    _vikunja_db_credentials_secret_uuid: "{{ vikunja_db_credentials_secret_id | regex_replace('^[^/]+/', '') }}"
  tags: [secrets]

- name: Look up Vikunja app secrets from Scaleway
  ansible.builtin.set_fact:
    vikunja_app_secrets: "{{ lookup('scaleway.scaleway.scaleway_secret', _vikunja_app_secret_uuid) | b64decode | from_json }}"
  no_log: true
  tags: [secrets]

- name: Look up Vikunja DB credentials from Scaleway
  ansible.builtin.set_fact:
    vikunja_db_credentials: "{{ lookup('scaleway.scaleway.scaleway_secret', _vikunja_db_credentials_secret_uuid) | b64decode | from_json }}"
  no_log: true
  tags: [secrets]

- name: Default Vikunja SMTP config to empty when smtp_secret_name is unset
  ansible.builtin.set_fact:
    vikunja_smtp_config: {}
  when: vikunja_smtp_secret_name | default('') | length == 0
  tags: [secrets]

- name: Look up SMTP config from Scaleway
  ansible.builtin.set_fact:
    vikunja_smtp_config: "{{ lookup('scaleway.scaleway.scaleway_secret', vikunja_smtp_secret_name, errors='ignore') | default('e30=', true) | b64decode | from_json }}"
  when: vikunja_smtp_secret_name | default('') | length > 0
  no_log: true
  tags: [secrets]

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ vikunja_install_dir }}/docker-compose.yml"
    mode: "0644"
    owner: "{{ vikunja_file_owner }}"
    group: "{{ vikunja_file_group }}"
  notify: Restart vikunja

- name: Render Vikunja environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ vikunja_install_dir }}/.env"
    mode: "0600"
    owner: "{{ vikunja_file_owner }}"
    group: "{{ vikunja_file_group }}"
  notify: Restart vikunja
  no_log: true
  tags: [secrets]

- name: Ensure Vikunja stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ vikunja_install_dir }}"
    state: present
