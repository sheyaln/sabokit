---
# Deploy Outline as a docker-compose stack. Secrets are pulled from Scaleway
# Secret Manager at deploy time and rendered into /opt/outline/.env (mode 0600).
#
# Required vars:
#   outline_hostname                  - full hostname
#   outline_app_secret_id             - Scaleway secret ID for the app's secret bag
#   outline_db_credentials_secret_id  - Scaleway secret ID for DB credentials
#
# Prereqs (NOT installed by this role — see platform/ansible/bootstrap.yml):
#   - Docker engine + compose plugin
#   - Traefik on an external network named per outline_traefik_docker_network
#   - scaleway.scaleway Ansible collection on the controller (for the lookup)

- name: Validate required Outline variables
  ansible.builtin.assert:
    that:
      - outline_hostname | length > 0
      - outline_app_secret_id | length > 0
      - outline_db_credentials_secret_id | length > 0
    fail_msg: "outline_hostname, outline_app_secret_id and outline_db_credentials_secret_id are required."

- name: Assert Docker is installed and running
  ansible.builtin.command: docker info
  register: outline_docker_check
  changed_when: false
  failed_when: outline_docker_check.rc != 0
  # If this fails, run platform/ansible/bootstrap.yml first.

- name: Assert Traefik external network exists
  community.docker.docker_network_info:
    name: "{{ outline_traefik_docker_network }}"
  register: outline_traefik_net
  failed_when: not outline_traefik_net.exists
  # If this fails, the traefik role from platform/ansible/bootstrap.yml hasn't run.

- name: Ensure Outline directory exists
  ansible.builtin.file:
    path: "{{ outline_install_dir }}"
    state: directory
    mode: "0750"
    owner: "{{ outline_file_owner }}"
    group: "{{ outline_file_group }}"

- name: Normalize Scaleway secret IDs (strip leading region/ prefix)
  ansible.builtin.set_fact:
    _outline_app_secret_uuid: "{{ outline_app_secret_id | regex_replace('^[^/]+/', '') }}"
    _outline_db_credentials_secret_uuid: "{{ outline_db_credentials_secret_id | regex_replace('^[^/]+/', '') }}"
  tags: [secrets]

- name: Look up Outline app secrets from Scaleway
  ansible.builtin.set_fact:
    outline_app_secrets: "{{ lookup('scaleway.scaleway.scaleway_secret', _outline_app_secret_uuid) | b64decode | from_json }}"
  no_log: true
  tags: [secrets]

- name: Look up Outline DB credentials from Scaleway
  ansible.builtin.set_fact:
    outline_db_credentials: "{{ lookup('scaleway.scaleway.scaleway_secret', _outline_db_credentials_secret_uuid) | b64decode | from_json }}"
  no_log: true
  tags: [secrets]

- name: Default Outline SMTP config to empty when smtp_secret_name is unset
  ansible.builtin.set_fact:
    outline_smtp_config: {}
  when: outline_smtp_secret_name | default('') | length == 0
  tags: [secrets]

- name: Look up SMTP config from Scaleway
  ansible.builtin.set_fact:
    outline_smtp_config: "{{ lookup('scaleway.scaleway.scaleway_secret', outline_smtp_secret_name, errors='ignore') | default('e30=', true) | b64decode | from_json }}"
  when: outline_smtp_secret_name | default('') | length > 0
  no_log: true
  tags: [secrets]

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ outline_install_dir }}/docker-compose.yml"
    mode: "0644"
    owner: "{{ outline_file_owner }}"
    group: "{{ outline_file_group }}"
  notify: Restart outline

- name: Render Outline environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ outline_install_dir }}/.env"
    mode: "0600"
    owner: "{{ outline_file_owner }}"
    group: "{{ outline_file_group }}"
  notify: Restart outline
  no_log: true
  tags: [secrets]

- name: Ensure Outline stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ outline_install_dir }}"
    state: present
