---
# Set by the consumer via the values that come out of platform/apps/watchtower/terraform's ansible.vars output.

watchtower_image: "containrrr/watchtower"
watchtower_image_tag: "latest"

watchtower_install_dir: "/opt/watchtower"

# Polling schedule (6-field cron, seconds first). Default daily at 04:00 UTC.
watchtower_schedule: "0 0 4 * * *"

# When true, only update containers carrying com.centurylinklabs.watchtower.enable=true.
watchtower_label_enable: true

# Optional scope filter; only update containers also carrying matching scope label.
watchtower_scope: ""

# Cleanup old image layers after successful update.
watchtower_cleanup: true

# Restart containers one-at-a-time during an update batch.
watchtower_rolling_restart: true

# Also update stopped containers.
watchtower_include_stopped: false

watchtower_timezone: "UTC"

# Optional Slack webhook URL for post-update summary notifications.
watchtower_notifications_slack_webhook: ""

# Resource limits.
watchtower_memory_limit: "256M"
watchtower_memory_reservation: "32M"
watchtower_cpu_limit: "0.5"
watchtower_cpu_reservation: "0.05"

# Filesystem owner/group for /opt/<slug>/ artifacts (compose file, .env).
# Defaults to the deploy user (ubuntu on stock cloud images) so the role
# doesn't leave the install dir root-owned. The deploy user is already in
# the docker group via the base/docker role and can therefore run
# `docker compose` against the rendered files without escalation.
watchtower_file_owner: "ubuntu"
watchtower_file_group: "ubuntu"
