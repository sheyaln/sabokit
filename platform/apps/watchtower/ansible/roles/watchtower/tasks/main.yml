---
# Deploy Watchtower as a one-container docker-compose stack. Reads
# /var/run/docker.sock to inspect + restart sibling containers.
#
# Required vars: none. All have sensible defaults; consumer overrides via
# platform/apps/watchtower/terraform vars.

- name: Assert Docker is installed and running
  ansible.builtin.command: docker info
  register: watchtower_docker_check
  changed_when: false
  failed_when: watchtower_docker_check.rc != 0

- name: Ensure Watchtower directory
  ansible.builtin.file:
    path: "{{ watchtower_install_dir }}"
    state: directory
    mode: "0750"
    owner: "{{ watchtower_file_owner }}"
    group: "{{ watchtower_file_group }}"

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ watchtower_install_dir }}/docker-compose.yml"
    mode: "0644"
    owner: "{{ watchtower_file_owner }}"
    group: "{{ watchtower_file_group }}"
  notify: Restart watchtower

- name: Ensure Watchtower is running
  community.docker.docker_compose_v2:
    project_src: "{{ watchtower_install_dir }}"
    state: present
    pull: missing
