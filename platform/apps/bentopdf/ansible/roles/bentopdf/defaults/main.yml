---
bentopdf_hostname: ""                       # Required.
bentopdf_image: "ghcr.io/digital-blueprint/bento-pdf:latest"

bentopdf_install_dir: "/opt/bentopdf"
bentopdf_traefik_docker_network: "traefik"
bentopdf_authentik_middleware: "authentik-auth@docker"

# Ops-bundle opt-in labels. true = labelled for the platform's diun / autoheal
# sidecars on the same host (if deployed); false = unlabelled, those services
# skip it.
bentopdf_diun_watch_enabled: true
bentopdf_autoheal_enabled: true

# Resource limits — PDF rendering is mostly CPU. Default conservative; bump
# memory if the host serves large attachments.
bentopdf_memory_limit: "512M"
bentopdf_memory_reservation: "128M"
bentopdf_cpu_limit: "1.0"
bentopdf_cpu_reservation: "0.25"

# Filesystem owner/group for /opt/<slug>/ artifacts (compose file, .env).
# Defaults to the deploy user (ubuntu on stock cloud images) so the role
# doesn't leave the install dir root-owned. The deploy user is already in
# the docker group via the base/docker role and can therefore run
# `docker compose` against the rendered files without escalation.
bentopdf_file_owner: "ubuntu"
bentopdf_file_group: "ubuntu"
