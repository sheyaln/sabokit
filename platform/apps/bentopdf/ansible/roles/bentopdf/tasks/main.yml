---
# Deploy BentoPDF behind Authentik forward-auth.
#
# Required vars:
#   bentopdf_hostname  - full hostname
#
# Prereqs (NOT installed by this role — see platform/ansible/bootstrap.yml):
#   - Docker engine + compose plugin
#   - Traefik on an external network named per bentopdf_traefik_docker_network
#   - Authentik embedded outpost wired (middleware bentopdf_authentik_middleware)

- name: Validate required BentoPDF variables
  ansible.builtin.assert:
    that:
      - bentopdf_hostname | length > 0
    fail_msg: "bentopdf_hostname is required."

- name: Assert Docker is installed and running
  ansible.builtin.command: docker info
  register: bentopdf_docker_check
  changed_when: false
  failed_when: bentopdf_docker_check.rc != 0

- name: Assert Traefik external network exists
  community.docker.docker_network_info:
    name: "{{ bentopdf_traefik_docker_network }}"
  register: bentopdf_traefik_net
  failed_when: not bentopdf_traefik_net.exists

- name: Ensure BentoPDF directory exists
  ansible.builtin.file:
    path: "{{ bentopdf_install_dir }}"
    state: directory
    mode: "0750"
    owner: root
    group: root

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ bentopdf_install_dir }}/docker-compose.yml"
    mode: "0644"
    owner: root
    group: root
  notify: Restart bentopdf

- name: Ensure BentoPDF stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ bentopdf_install_dir }}"
    state: present
