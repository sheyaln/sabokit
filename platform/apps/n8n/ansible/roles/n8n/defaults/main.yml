---
# Set by the consumer via the values that come out of platform/apps/n8n/terraform's ansible.vars output.

n8n_hostname: ""                              # Required. The full hostname (e.g. "flows.example.org").
n8n_image: "docker.n8n.io/n8nio/n8n"
n8n_image_tag: "latest"

n8n_install_dir: "/opt/n8n"

# Ops-bundle opt-in labels.
# auto_update default false: schema migrations + lockstep n8n/runners version
# requirement; let Ansible bump both together.
n8n_diun_watch_enabled: true
n8n_autoheal_enabled: true

n8n_timezone: "UTC"

# Public REST API: high-value attack surface because workflows hold credentials
# for every connected service. Default off.
n8n_public_api_disabled: true

# Built-in n8n Prometheus exporter at /metrics. Off by default — metrics
# include workflow names and can leak operational info. Flip to true on the
# role side and add a scrape config in monitoring.tf to surface them.
n8n_metrics_enabled: false

# External task runner allowlists (mirrored into n8n-task-runners.json).
# Upstream defaults block everything — even `import json` — for the python
# runner. These are the merged allowlists the runners JSON template reads.
n8n_python_stdlib_allow: "json,re,math,datetime,time,base64,hashlib,collections,itertools,functools,urllib,urllib.parse,uuid,string,decimal"
n8n_python_external_allow: ""

# Webhook router rate-limit (Traefik middleware). Webhooks bypass OIDC.
n8n_webhook_rate_limit_avg: 100
n8n_webhook_rate_limit_burst: 50
n8n_webhook_rate_limit_per: "1m"

# Scaleway secret IDs (set by Terraform; passed in via ansible.vars).
n8n_app_secret_id: ""                         # Single Scaleway secret with encryption key, runners auth token, OIDC bag.
n8n_db_credentials_secret_id: ""              # Scaleway secret with {dbname, username, password, host, port}.

# Docker networks the n8n container joins.
n8n_traefik_docker_network: "traefik"

# Resource limits.
n8n_memory_limit: "1G"
n8n_memory_reservation: "256M"
n8n_cpu_limit: "1.0"
n8n_cpu_reservation: "0.25"

# Extra environment variables rendered into the container's .env. Map of
# KEY → value; consumer-template populates this from other bundles' outputs
# (e.g. BROADSHEET_BASE_URL, ESPOCRM_BASE_URL, SLACK_CHANNEL_*) so workflow
# JSONs in platform/identity/n8n-workflows/ stay org-agnostic and reference
# them via $env.KEY.
n8n_extra_env_vars: {}

# Extra docker networks attached to the n8n container alongside the bundle's
# default networks. For cross-bundle integration with sidecars (e.g.
# protonmail-bridge) that live in their own bootstrap-tier network. Networks
# listed here must be marked `external: true` and must already exist on the
# host (created by whichever bundle owns them).
n8n_extra_docker_networks: []

# Local directory of n8n workflow JSON files to sync to the apps host and
# auto-import on each deploy. Resolved by the controller — relative paths
# resolve against the playbook invocation cwd; absolute paths used verbatim.
# Empty = feature off (no host directory created, no compose mount, no import
# task). n8n's importer upserts by workflow `id`, so re-runs are idempotent.
n8n_workflows_dir: ""

# Host-side directory the controller syncs workflow JSON files into. Bind-
# mounted read-only into the n8n container at /workflows-import/ when
# n8n_workflows_dir is non-empty.
n8n_workflows_host_dir: "/opt/n8n/workflows-import"

# Filesystem owner/group for /opt/<slug>/ artifacts (compose file, .env).
# Defaults to the deploy user (ubuntu on stock cloud images) so the role
# doesn't leave the install dir root-owned. The deploy user is already in
# the docker group via the base/docker role and can therefore run
# `docker compose` against the rendered files without escalation.
n8n_file_owner: "ubuntu"
n8n_file_group: "ubuntu"
