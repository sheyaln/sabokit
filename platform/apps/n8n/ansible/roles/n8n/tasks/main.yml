---
# Deploy n8n as a docker-compose stack. Secrets are pulled from Scaleway
# Secret Manager at deploy time and rendered into /opt/n8n/.env (mode 0600).
#
# Required vars:
#   n8n_hostname                  - full hostname
#   n8n_app_secret_id             - Scaleway secret ID for the app's secret bag
#   n8n_db_credentials_secret_id  - Scaleway secret ID for DB credentials
#
# Prereqs (NOT installed by this role — see platform/ansible/bootstrap.yml):
#   - Docker engine + compose plugin
#   - Traefik on an external network named per n8n_traefik_docker_network
#   - scaleway.scaleway Ansible collection on the controller (for the lookup)

- name: Validate required n8n variables
  ansible.builtin.assert:
    that:
      - n8n_hostname | length > 0
      - n8n_app_secret_id | length > 0
      - n8n_db_credentials_secret_id | length > 0
    fail_msg: "n8n_hostname, n8n_app_secret_id and n8n_db_credentials_secret_id are required."

- name: Assert Docker is installed and running
  ansible.builtin.command: docker info
  register: n8n_docker_check
  changed_when: false
  failed_when: n8n_docker_check.rc != 0
  # If this fails, run platform/ansible/bootstrap.yml first.

- name: Assert Traefik external network exists
  community.docker.docker_network_info:
    name: "{{ n8n_traefik_docker_network }}"
  register: n8n_traefik_net
  failed_when: not n8n_traefik_net.exists
  # If this fails, the traefik role from platform/ansible/bootstrap.yml hasn't run.

- name: Ensure n8n directory exists
  ansible.builtin.file:
    path: "{{ n8n_install_dir }}"
    state: directory
    mode: "0750"
    owner: "{{ n8n_file_owner }}"
    group: "{{ n8n_file_group }}"

- name: Normalize Scaleway secret IDs (strip leading region/ prefix)
  ansible.builtin.set_fact:
    _n8n_app_secret_uuid: "{{ n8n_app_secret_id | regex_replace('^[^/]+/', '') }}"
    _n8n_db_credentials_secret_uuid: "{{ n8n_db_credentials_secret_id | regex_replace('^[^/]+/', '') }}"
  tags: [secrets]

- name: Look up n8n app secrets from Scaleway
  ansible.builtin.set_fact:
    n8n_app_secrets: "{{ lookup('scaleway.scaleway.scaleway_secret', _n8n_app_secret_uuid) | b64decode | from_json }}"
  no_log: true
  tags: [secrets]

- name: Look up n8n DB credentials from Scaleway
  ansible.builtin.set_fact:
    n8n_db_credentials: "{{ lookup('scaleway.scaleway.scaleway_secret', _n8n_db_credentials_secret_uuid) | b64decode | from_json }}"
  no_log: true
  tags: [secrets]

# hooks.js is the OIDC external-hook file. n8n loads it via EXTERNAL_HOOK_FILES
# and it wires the entire OIDC dance plus JIT user provisioning. Bind-mounted
# into the container by docker-compose; copying it to the host keeps the
# editable-on-host story simple if a consumer ever needs to patch.
- name: Deploy n8n OIDC hooks.js
  ansible.builtin.copy:
    src: hooks.js
    dest: "{{ n8n_install_dir }}/hooks.js"
    mode: "0644"
    owner: "{{ n8n_file_owner }}"
    group: "{{ n8n_file_group }}"
  notify: Restart n8n

# Upstream's launcher config is locked down to the point of being unusable
# (the python runner blocks `import json`). We render our own with a sane
# stdlib allowlist; mounted into the runners container at /etc/n8n-task-runners.json.
- name: Render task-runner launcher config
  ansible.builtin.template:
    src: n8n-task-runners.json.j2
    dest: "{{ n8n_install_dir }}/n8n-task-runners.json"
    mode: "0644"
    owner: "{{ n8n_file_owner }}"
    group: "{{ n8n_file_group }}"
  notify: Restart n8n

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ n8n_install_dir }}/docker-compose.yml"
    mode: "0644"
    owner: "{{ n8n_file_owner }}"
    group: "{{ n8n_file_group }}"
  notify: Restart n8n

- name: Render n8n environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ n8n_install_dir }}/.env"
    mode: "0600"
    owner: "{{ n8n_file_owner }}"
    group: "{{ n8n_file_group }}"
  notify: Restart n8n
  no_log: true
  tags: [secrets]

- name: Ensure host-side workflow-import directory exists
  ansible.builtin.file:
    path: "{{ n8n_workflows_host_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ n8n_file_owner }}"
    group: "{{ n8n_file_group }}"
  when: n8n_workflows_dir | length > 0

# Resolve the controller-side path to an absolute path so copy doesn't
# surprise us with cwd-dependent relative resolution. Relative paths resolve
# against the playbook invocation cwd (i.e. the consumer's environments/<env>/
# dir, since that's where up.sh runs ansible-playbook).
- name: Resolve n8n_workflows_dir to an absolute path
  ansible.builtin.set_fact:
    _n8n_workflows_dir_abs: "{{ n8n_workflows_dir | expanduser | realpath }}"
  delegate_to: localhost
  run_once: true
  when: n8n_workflows_dir | length > 0

- name: Assert controller-side workflows dir exists
  ansible.builtin.stat:
    path: "{{ _n8n_workflows_dir_abs }}"
  register: _n8n_workflows_src_stat
  delegate_to: localhost
  run_once: true
  when: n8n_workflows_dir | length > 0

- name: Fail if workflows_dir is set but missing on the controller
  ansible.builtin.fail:
    msg: "n8n_workflows_dir={{ n8n_workflows_dir }} (resolved {{ _n8n_workflows_dir_abs }}) does not exist on the controller."
  when:
    - n8n_workflows_dir | length > 0
    - not _n8n_workflows_src_stat.stat.exists or not _n8n_workflows_src_stat.stat.isdir

- name: Sync workflow JSON files to host
  ansible.builtin.copy:
    src: "{{ _n8n_workflows_dir_abs }}/"
    dest: "{{ n8n_workflows_host_dir }}/"
    mode: "0644"
    owner: "{{ n8n_file_owner }}"
    group: "{{ n8n_file_group }}"
  when: n8n_workflows_dir | length > 0
  notify: Restart n8n

- name: Ensure n8n stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ n8n_install_dir }}"
    state: present
    pull: missing

# Flush handlers so any "Restart n8n" notifications above land BEFORE we try
# to exec into the container — otherwise we may exec into an old container
# that's about to be torn down by the handler.
- name: Apply pending restarts before workflow import
  ansible.builtin.meta: flush_handlers

- name: Wait for n8n container healthcheck before importing workflows
  ansible.builtin.command: >
    docker inspect -f '{% raw %}{{.State.Health.Status}}{% endraw %}' n8n
  register: _n8n_health
  retries: 20
  delay: 6
  until: _n8n_health.stdout == "healthy"
  changed_when: false
  when: n8n_workflows_dir | length > 0

# Idempotent: n8n's importer upserts by workflow `id`. Same JSON, same id,
# re-running this is a no-op against the DB. Imported workflows land
# inactive by default (`--activeState=false`); operators activate via the
# UI on first deploy and the active flag survives subsequent imports.
# Exec into the container — n8n CLI lives in the n8n image, not on the host.
- name: Auto-import n8n workflows
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - n8n
      - n8n
      - import:workflow
      - --separate
      - --input=/workflows-import/
  register: _n8n_import
  changed_when: "'Successfully imported' in _n8n_import.stdout"
  when: n8n_workflows_dir | length > 0
