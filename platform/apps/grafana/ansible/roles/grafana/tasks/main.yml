---
# Deploy Grafana with OIDC (Authentik) + provisioned Prometheus + Loki
# datasources. Joins the shared monitoring_internal network so it can reach
# the prometheus and loki bundles by hostname.

- name: Validate required Grafana variables
  ansible.builtin.assert:
    that:
      - grafana_hostname | length > 0
      - grafana_app_secret_id | length > 0
    fail_msg: "grafana_hostname and grafana_app_secret_id are required."

- name: Assert Docker is installed and running
  ansible.builtin.command: docker info
  register: grafana_docker_check
  changed_when: false
  failed_when: grafana_docker_check.rc != 0

- name: Assert Traefik external network exists
  community.docker.docker_network_info:
    name: "{{ grafana_traefik_docker_network }}"
  register: grafana_traefik_net
  failed_when: not grafana_traefik_net.exists

- name: Ensure Grafana directory tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: "{{ grafana_file_owner }}"
    group: "{{ grafana_file_group }}"
  loop:
    - "{{ grafana_install_dir }}"
    - "{{ grafana_install_dir }}/provisioning"
    - "{{ grafana_install_dir }}/provisioning/datasources"
    - "{{ grafana_install_dir }}/provisioning/dashboards"
    - "{{ grafana_install_dir }}/provisioning/alerting"

- name: Ensure shared monitoring network exists
  community.docker.docker_network:
    name: "{{ grafana_internal_network }}"
    state: present

- name: Normalize Scaleway secret ID
  ansible.builtin.set_fact:
    _grafana_app_secret_uuid: "{{ grafana_app_secret_id | regex_replace('^[^/]+/', '') }}"
  tags: [secrets]

- name: Look up Grafana app secrets from Scaleway
  ansible.builtin.set_fact:
    grafana_app_secrets: "{{ lookup('scaleway.scaleway.scaleway_secret', _grafana_app_secret_uuid) | b64decode | from_json }}"
  no_log: true
  tags: [secrets]

- name: Render datasources.yml
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: "{{ grafana_install_dir }}/provisioning/datasources/datasources.yml"
    mode: "0644"
  notify: Restart grafana

- name: Render dashboard provider
  ansible.builtin.template:
    src: dashboard-provider.yml.j2
    dest: "{{ grafana_install_dir }}/provisioning/dashboards/provider.yml"
    mode: "0644"
  notify: Restart grafana

# File provider polls every 30s (see dashboard-provider.yml.j2), so no
# restart is needed when only the JSON contents change.
- name: Provision aggregated dashboards
  ansible.builtin.copy:
    dest: "{{ grafana_install_dir }}/provisioning/dashboards/{{ item.filename }}"
    content: "{{ item.contents }}"
    mode: "0644"
  loop: "{{ grafana_dashboards }}"
  loop_control:
    label: "{{ item.filename }}"

# JSM (Jira Service Management Ops, heritage Opsgenie) alerting destination.
# Render contact-points + root policy when a secret ID is supplied; remove
# both when not, so toggling off cleanly reverts to Grafana's built-in default.
- name: Resolve JSM API URL by region
  ansible.builtin.set_fact:
    _grafana_jsm_api_url: >-
      {{
        'https://api.atlassian.com/jsm/ops/integration/v1/alerts'
        if grafana_jsm_api_region == 'us'
        else 'https://api.eu.atlassian.com/jsm/ops/integration/v1/alerts'
      }}
  when: grafana_jsm_api_key_secret_id | length > 0
  tags: [secrets]

- name: Normalize JSM Scaleway secret ID
  ansible.builtin.set_fact:
    _grafana_jsm_secret_uuid: "{{ grafana_jsm_api_key_secret_id | regex_replace('^[^/]+/', '') }}"
  when: grafana_jsm_api_key_secret_id | length > 0
  tags: [secrets]

- name: Look up JSM API key from Scaleway
  ansible.builtin.set_fact:
    grafana_jsm_secrets: "{{ lookup('scaleway.scaleway.scaleway_secret', _grafana_jsm_secret_uuid) | b64decode | from_json }}"
  when: grafana_jsm_api_key_secret_id | length > 0
  no_log: true
  tags: [secrets]

- name: Render JSM contact points
  ansible.builtin.template:
    src: alerting-contact-points.yml.j2
    dest: "{{ grafana_install_dir }}/provisioning/alerting/contact-points.yml"
    mode: "0600"
  when: grafana_jsm_api_key_secret_id | length > 0
  no_log: true
  notify: Restart grafana
  tags: [secrets]

- name: Render JSM-routed root policy
  ansible.builtin.template:
    src: alerting-policies.yml.j2
    dest: "{{ grafana_install_dir }}/provisioning/alerting/policies.yml"
    mode: "0644"
  when: grafana_jsm_api_key_secret_id | length > 0
  notify: Restart grafana

- name: Remove JSM provisioning files when disabled
  ansible.builtin.file:
    path: "{{ grafana_install_dir }}/provisioning/alerting/{{ item }}"
    state: absent
  loop:
    - contact-points.yml
    - policies.yml
  when: grafana_jsm_api_key_secret_id | length == 0
  notify: Restart grafana

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ grafana_install_dir }}/docker-compose.yml"
    mode: "0644"
  notify: Restart grafana

- name: Render Grafana environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ grafana_install_dir }}/.env"
    mode: "0600"
  notify: Restart grafana
  no_log: true
  tags: [secrets]

- name: Ensure Grafana is running
  community.docker.docker_compose_v2:
    project_src: "{{ grafana_install_dir }}"
    state: present
    pull: missing
