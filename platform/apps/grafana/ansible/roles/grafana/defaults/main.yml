---
grafana_hostname: ""                       # Required.
grafana_image: "grafana/grafana"
grafana_image_tag: "latest"
grafana_install_dir: "/opt/grafana"
grafana_traefik_docker_network: "traefik"
grafana_internal_network: "monitoring_internal"

grafana_plugins: []
grafana_oidc_admin_group: "admin"
grafana_oidc_editor_group: "manager"
grafana_prometheus_url: "http://prometheus:9090"
grafana_loki_url: "http://loki:3100"
grafana_prometheus_scrape_interval: "30s"

grafana_app_secret_id: ""

grafana_memory_limit: "1G"
grafana_memory_reservation: "256M"
grafana_cpu_limit: "1.0"
grafana_cpu_reservation: "0.1"

grafana_diun_watch_enabled: true
grafana_autoheal_enabled: true

# Dashboards provisioned via the file provider. Populated from the aggregated
# union of every enabled app's monitoring.grafana_dashboards by the consumer.
# Each entry: {filename: "foo.json", contents: "<rendered JSON>"}.
grafana_dashboards: []

# JSM (Jira Service Management Operations, heritage Opsgenie) integration.
# Empty secret ID = JSM provisioning skipped — no contact point file, root
# policy stays on Grafana's default destination. When non-empty, the role
# pulls the API key from Scaleway Secret Manager and provisions a
# `jsm-default` contact point that the root notification policy targets.
grafana_jsm_api_key_secret_id: ""
grafana_jsm_api_region: "us"
grafana_jsm_priority_mapping:
  critical: P1
  warning: P3
  info: P5
grafana_jsm_alert_tags:
  - sabokit
# Severity-gate routing. Empty = JSM is the root contact when an API key is
# set (existing behaviour). Non-empty (e.g. "critical") = root stays on
# Grafana's built-in `grafana-default` contact (consumer wires that to n8n
# or another fan-out target out of band) and JSM moves to a child policy
# matching `severity = <value>` with `continue: true`.
grafana_jsm_severity_gate: ""

# Filesystem owner/group for /opt/<slug>/ artifacts (compose file, .env).
# Defaults to the deploy user (ubuntu on stock cloud images) so the role
# doesn't leave the install dir root-owned. The deploy user is already in
# the docker group via the base/docker role and can therefore run
# `docker compose` against the rendered files without escalation.
grafana_file_owner: "ubuntu"
grafana_file_group: "ubuntu"
grafana_extra_env_vars: {}

# Extra docker networks attached to the grafana container alongside the bundle's
# traefik network. Networks must already exist on the host (created by whichever
# bundle owns them) and are declared `external: true` in compose.
grafana_extra_docker_networks: []

