---
wazuh_agent_image: "wazuh/wazuh-agent"
wazuh_agent_release_version: "4.9.0"
wazuh_agent_install_dir: "/opt/wazuh-agent"
wazuh_agent_name: ""
wazuh_agent_manager_address: ""

wazuh_agent_diun_watch_enabled: true
wazuh_agent_autoheal_enabled: true

# File Integrity Monitoring — defaults-on, see templates/ossec.conf.j2 +
# templates/audit.rules.j2 for the full path set.
wazuh_agent_fim_enabled: true
wazuh_agent_fim_extra_paths: []
wazuh_agent_fim_extra_exclusions: []
