---
wazuh_hostname: ""
wazuh_version: "4.9.0"
wazuh_certs_generator_version: "0.0.2"

wazuh_install_dir: "/opt/wazuh"
wazuh_traefik_docker_network: "traefik"
wazuh_indexer_heap_size: "1g"

wazuh_manager_agent_port: 1514
wazuh_manager_enrollment_port: 1515
wazuh_manager_syslog_port: 514

wazuh_app_secret_id: ""

wazuh_memory_limit: "2G"
wazuh_memory_reservation: "512M"
wazuh_cpu_limit: "2.0"
wazuh_cpu_reservation: "0.5"

wazuh_auto_update_enabled: false
wazuh_autoheal_enabled: true

# Set true on next play to throw away the existing certs and re-generate.
wazuh_regenerate_certs: false
