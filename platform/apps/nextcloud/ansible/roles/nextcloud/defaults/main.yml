---
# Set by the consumer via the values that come out of platform/apps/nextcloud/terraform's ansible.vars output.

nextcloud_hostname: ""                          # Required. Full hostname (e.g. "cloud.example.org").
nextcloud_image: "nextcloud"
nextcloud_image_tag: "32-apache"                # Pin to a major; Nextcloud only supports one-major-at-a-time upgrades.

nextcloud_install_dir: "/opt/nextcloud"

# Scaleway secret IDs (set by Terraform; passed in via ansible.vars).
nextcloud_app_secret_id: ""                     # Single Scaleway secret holding admin + redis + OIDC + S3 bag.
nextcloud_db_credentials_secret_id: ""          # Scaleway secret with {dbname, username, password, host, port}.

# SMTP — From: address travels in the app-secrets bag; SMTP creds come from a
# separate platform secret. Empty = SMTP off; the role's lookup short-circuits
# and Nextcloud runs without email. Terraform sets this from var.smtp_from_email
# (empty → "", non-empty → "smtp-config") and passes it through ansible.vars.
nextcloud_smtp_secret_name: ""

# Docker network the Nextcloud container joins.
nextcloud_traefik_docker_network: "traefik"

# Apache body limit must match max_upload_size_bytes from terraform.
nextcloud_apache_body_limit: 2147483648

# Resource limits.
nextcloud_memory_limit: "2G"
nextcloud_memory_reservation: "512M"
nextcloud_cpu_limit: "2.0"
nextcloud_cpu_reservation: "0.5"

# Timezone applied to all containers (mostly for log timestamps).
nextcloud_timezone: "UTC"

# User-facing instance name (the string Nextcloud shows in browser tabs,
# email headers, mobile clients, etc.). Default "Nextcloud" — override for
# branding.
nextcloud_instance_name: "Nextcloud"

# UTC hour when Nextcloud runs its nightly background-job window. `2` = 2 AM.
nextcloud_maintenance_window_start: 2

# Apps the configure script enables on every run (idempotent). The default
# set turns Nextcloud from a plain file-store into a credible knowledge +
# collaboration platform: group folders, push notifications, notes, tasks,
# forms, polls, epub reader, and outbound webhooks. Drop entries to keep a
# leaner install; add more (e.g. "deck", "calendar", "contacts") to extend.
nextcloud_enabled_apps:
  - groupfolders
  - notify_push
  - notes
  - tasks
  - forms
  - polls
  - epubviewer
  - webhook_listeners

# Apps the configure script disables on every run. Photos is disabled by
# default — heavy thumbnail jobs that most consumers don't actively use.
nextcloud_disabled_apps:
  - photos

# Optional: URL of an n8n webhook receiver for Nextcloud Forms submissions.
# When non-empty, the configure script registers a webhook_listeners hook
# pointed at this URL on the OCA\Forms\Events\FormSubmittedEvent. Idempotent.
# Empty disables registration.
nextcloud_n8n_form_webhook_url: ""

# ── OnlyOffice Document Server ───────────────────────────────────────────────
# Hostname is required when the stack is enabled; the configure script also
# wires Nextcloud's onlyoffice connector app to talk to it on this URL.

nextcloud_onlyoffice_hostname: ""               # Required. Full hostname (e.g. "docs.example.org").
nextcloud_onlyoffice_image: "onlyoffice/documentserver"
nextcloud_onlyoffice_image_tag: "latest"

# Resource caps. The bundled postgres + redis inside the documentserver image
# stay in-container — we don't externalize them. Single-instance ops, no
# horizontal scaling concerns.
nextcloud_onlyoffice_memory_limit: "2G"
nextcloud_onlyoffice_memory_reservation: "512M"
nextcloud_onlyoffice_cpu_limit: "2.0"
nextcloud_onlyoffice_cpu_reservation: "0.25"

# ── Talk HPB (TURN + signaling, AIO image) ───────────────────────────────────
# One container bundles eturnal (TURN/STUN), Janus, and the standalone
# signaling server. Image: ghcr.io/nextcloud-releases/aio-talk.

nextcloud_talk_hostname: ""                     # Required. Full hostname (e.g. "talk.example.org").
nextcloud_talk_image: "ghcr.io/nextcloud-releases/aio-talk"
nextcloud_talk_image_tag: "latest"

# WebRTC ports. The TURN control port and the UDP relay range MUST be open in
# the host's security group; this role only declares the docker mappings —
# whoever provisions the VM is responsible for the firewall. README documents.
nextcloud_talk_turn_port: 3478
nextcloud_talk_relay_port_min: 49152
nextcloud_talk_relay_port_max: 49252

nextcloud_talk_memory_limit: "1G"
nextcloud_talk_memory_reservation: "128M"
nextcloud_talk_cpu_limit: "1.0"
nextcloud_talk_cpu_reservation: "0.1"

# Ops-bundle opt-in labels.
# auto_update default false: Nextcloud is one-major-at-a-time and needs
# post-upgrade occ steps; let Ansible handle the bumps.
nextcloud_auto_update_enabled: false
nextcloud_autoheal_enabled: true

# Filesystem owner/group for /opt/<slug>/ artifacts (compose file, .env).
# Defaults to the deploy user (ubuntu on stock cloud images) so the role
# doesn't leave the install dir root-owned. The deploy user is already in
# the docker group via the base/docker role and can therefore run
# `docker compose` against the rendered files without escalation.
nextcloud_file_owner: "ubuntu"
nextcloud_file_group: "ubuntu"
