---
# Deploy Autoheal as a one-container docker-compose stack.

- name: Assert Docker is installed and running
  ansible.builtin.command: docker info
  register: autoheal_docker_check
  changed_when: false
  failed_when: autoheal_docker_check.rc != 0

- name: Ensure Autoheal directory
  ansible.builtin.file:
    path: "{{ autoheal_install_dir }}"
    state: directory
    mode: "0750"
    owner: "{{ autoheal_file_owner }}"
    group: "{{ autoheal_file_group }}"

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ autoheal_install_dir }}/docker-compose.yml"
    mode: "0644"
    owner: "{{ autoheal_file_owner }}"
    group: "{{ autoheal_file_group }}"
  notify: Restart autoheal

- name: Ensure Autoheal is running
  community.docker.docker_compose_v2:
    project_src: "{{ autoheal_install_dir }}"
    state: present
    pull: missing
