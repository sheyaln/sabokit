---
# Deploy Postiz as a docker-compose stack. Secrets are pulled from Scaleway
# Secret Manager at deploy time and rendered into /opt/postiz/.env (mode 0600).
#
# Required vars:
#   postiz_hostname                  - full hostname
#   postiz_app_secret_id             - Scaleway secret ID for the app's secret bag
#   postiz_db_credentials_secret_id  - Scaleway secret ID for DB credentials
#
# Prereqs (NOT installed by this role — see platform/ansible/bootstrap.yml):
#   - Docker engine + compose plugin
#   - Traefik on an external network named per postiz_traefik_docker_network
#   - scaleway.scaleway Ansible collection on the controller (for the lookup)

- name: Validate required Postiz variables
  ansible.builtin.assert:
    that:
      - postiz_hostname | length > 0
      - postiz_app_secret_id | length > 0
      - postiz_db_credentials_secret_id | length > 0
    fail_msg: "postiz_hostname, postiz_app_secret_id and postiz_db_credentials_secret_id are required."

- name: Assert Docker is installed and running
  ansible.builtin.command: docker info
  register: postiz_docker_check
  changed_when: false
  failed_when: postiz_docker_check.rc != 0
  # If this fails, run platform/ansible/bootstrap.yml first.

- name: Assert Traefik external network exists
  community.docker.docker_network_info:
    name: "{{ postiz_traefik_docker_network }}"
  register: postiz_traefik_net
  failed_when: not postiz_traefik_net.exists
  # If this fails, the traefik role from platform/ansible/bootstrap.yml hasn't run.

- name: Ensure Postiz directory exists
  ansible.builtin.file:
    path: "{{ postiz_install_dir }}"
    state: directory
    mode: "0750"
    owner: root
    group: root

- name: Normalize Scaleway secret IDs (strip leading region/ prefix)
  ansible.builtin.set_fact:
    _postiz_app_secret_uuid: "{{ postiz_app_secret_id | regex_replace('^[^/]+/', '') }}"
    _postiz_db_credentials_secret_uuid: "{{ postiz_db_credentials_secret_id | regex_replace('^[^/]+/', '') }}"

- name: Look up Postiz app secrets from Scaleway
  ansible.builtin.set_fact:
    postiz_app_secrets: "{{ lookup('scaleway.scaleway.scaleway_secret', _postiz_app_secret_uuid) | b64decode | from_json }}"
  no_log: true

- name: Look up Postiz DB credentials from Scaleway
  ansible.builtin.set_fact:
    postiz_db_credentials: "{{ lookup('scaleway.scaleway.scaleway_secret', _postiz_db_credentials_secret_uuid) | b64decode | from_json }}"
  no_log: true

- name: Default Postiz SMTP config to empty when smtp_secret_name is unset
  ansible.builtin.set_fact:
    postiz_smtp_config: {}
  when: postiz_smtp_secret_name | default('') | length == 0

- name: Look up SMTP config from Scaleway
  ansible.builtin.set_fact:
    postiz_smtp_config: "{{ lookup('scaleway.scaleway.scaleway_secret', postiz_smtp_secret_name, errors='ignore') | default('e30=', true) | b64decode | from_json }}"
  when: postiz_smtp_secret_name | default('') | length > 0
  no_log: true

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ postiz_install_dir }}/docker-compose.yml"
    mode: "0644"
    owner: root
    group: root
  notify: Restart postiz

- name: Render Postiz environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ postiz_install_dir }}/.env"
    mode: "0600"
    owner: root
    group: root
  notify: Restart postiz
  no_log: true

- name: Ensure Postiz stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ postiz_install_dir }}"
    state: present
