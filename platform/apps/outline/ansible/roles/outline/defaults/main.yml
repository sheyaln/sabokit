---
# Set by the consumer via the values that come out of platform/apps/outline/terraform's ansible.vars output.

outline_hostname: ""                          # Required. The full hostname (e.g. "wiki.example.org").
outline_image: "docker.getoutline.com/outlinewiki/outline"
outline_image_tag: "latest"

outline_install_dir: "/opt/outline"

# Scaleway secret IDs (set by Terraform; passed in via ansible.vars).
outline_app_secret_id: ""                     # Single Scaleway secret holding all OIDC + S3 + app-secret values.
outline_db_credentials_secret_id: ""          # Scaleway secret with {dbname, username, password, host, port}.

# SMTP — Outline reads the From: header from terraform-rendered config; the
# SMTP creds themselves come from a separate Scaleway secret. Empty = SMTP
# off; the role's lookup task short-circuits and Outline runs without email.
# The platform Terraform sets this from var.smtp_from_email (empty → "",
# non-empty → "smtp-config") and passes it through apps.yml.
outline_smtp_secret_name: ""

# Docker networks the Outline container joins.
outline_traefik_docker_network: "traefik"

# Resource limits.
outline_memory_limit: "1G"
outline_memory_reservation: "512M"
outline_cpu_limit: "0.5"
outline_cpu_reservation: "0.25"

# File upload size (must match what was sent to terraform).
outline_max_upload_size_bytes: 26214400
