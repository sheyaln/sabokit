---
# Set by the consumer via the values that come out of platform/apps/diun/terraform's ansible.vars output.

diun_image: "crazymax/diun"
diun_image_tag: "4.31.0"

# Empty default = single-instance — container is just "diun". When set,
# the container becomes "diun-<instance_name>", same for the data dir
# and config file, so multiple instances on one host don't collide.
diun_instance_name: ""

# Derived names used everywhere in this role.
diun_qualified_name: "{{ 'diun' if diun_instance_name == '' else 'diun-' + diun_instance_name }}"
diun_install_dir: "/opt/{{ diun_qualified_name }}"

diun_timezone: "UTC"

# Polling schedule (6-field cron, seconds first). Default daily at 06:00 UTC,
# offset from backrest's 02:00 backup window so registry polls don't pile on
# top of nightly maintenance.
diun_watch_schedule: "0 0 6 * * *"

# Concurrent image-check workers (Diun's upstream default is 10).
diun_watch_workers: 10

# Suppress notifications for images Diun has never seen before. Avoids the
# first-boot flood where every running container looks "new".
diun_watch_first_check_notif: false

# Watch every container on the host without per-container opt-in label.
# Plug-and-play default. Flip false to require diun.enable=true labels.
diun_watch_by_default: true

# Watch ALL tags of every image vs. only the exact tag in use.
diun_default_watch_repo: false

# Docker-swarm-mode service discovery — sabokit does not ship Swarm.
diun_include_swarm_services: false

# Legacy list-shaped notifier config. Each entry is `{ type, config }`,
# rendered into diun.yml's notif: block verbatim. Empty = no legacy targets.
diun_notification_targets: []

# Auto-derived webhook URL (n8n's app_url + /webhook/diun-image-update). When
# non-empty, the role injects a webhook entry into diun.yml's notif: block
# pointing here. Empty = no auto-wired webhook target.
diun_n8n_webhook_url: ""

# Extra notification providers keyed by Diun notifier type (slack, mail, …).
# Merged into diun.yml's notif: block verbatim. See platform/apps/diun/README.md.
diun_notif_extra: {}

# Whether Diun watches its own image for updates. Default false — auto-bumping
# the tool whose job is to gate updates defeats the point.
diun_watch_enabled: false

# Whether autoheal restarts Diun on healthcheck failure.
diun_autoheal_enabled: true

# Resource limits — Diun is small.
diun_memory_limit: "128M"
diun_memory_reservation: "16M"
diun_cpu_limit: "0.25"
diun_cpu_reservation: "0.02"

# Filesystem owner/group for /opt/<slug>/ artifacts (compose file, .env).
# Defaults to the deploy user (ubuntu on stock cloud images) so the role
# doesn't leave the install dir root-owned. The deploy user is already in
# the docker group via the base/docker role and can therefore run
# `docker compose` against the rendered files without escalation.
diun_file_owner: "ubuntu"
diun_file_group: "ubuntu"
diun_extra_env_vars: {}
