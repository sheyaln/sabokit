---
notifuse_hostname: ""

# Stock `notifuse/notifuse:latest` does not support OIDC. If you need OIDC,
# either flip notifuse_build_from_source=true (clones the fork below and
# builds on the host) or point notifuse_image at a published fork image.
notifuse_image: "notifuse/notifuse"
notifuse_image_tag: "latest"
notifuse_build_from_source: false
notifuse_image_source_repo: "https://github.com/sheyaln/notifuse.git"
notifuse_image_source_ref: "feat/oidc-v1"

notifuse_install_dir: "/opt/notifuse"
notifuse_data_dir: "/opt/notifuse/data"
notifuse_traefik_docker_network: "traefik"

notifuse_timezone: "UTC"

notifuse_app_secret_id: ""
notifuse_db_credentials_secret_id: ""
notifuse_smtp_secret_name: ""

notifuse_memory_limit: "1G"
notifuse_memory_reservation: "256M"
notifuse_cpu_limit: "1.0"
notifuse_cpu_reservation: "0.25"
