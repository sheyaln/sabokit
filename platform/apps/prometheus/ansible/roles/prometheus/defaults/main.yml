---
prometheus_image: "prom/prometheus"
prometheus_image_tag: "latest"
prometheus_install_dir: "/opt/prometheus"

prometheus_retention: "30d"
prometheus_scrape_configs: []
prometheus_extra_scrape_targets: {}
prometheus_alert_rules: []
prometheus_exporters_enabled: true
prometheus_remote_write_enabled: true
prometheus_private_ip_bind: ""

prometheus_memory_limit: "2G"
prometheus_memory_reservation: "512M"
prometheus_cpu_limit: "2.0"
prometheus_cpu_reservation: "0.5"

prometheus_timezone: "UTC"

# Shared docker network for the monitoring stack. Grafana + Loki + Prometheus
# all join it so grafana can reach prometheus/loki by hostname.
prometheus_internal_network: "monitoring_internal"

# Ops labels (forwarded from terraform).
prometheus_auto_update_enabled: false
prometheus_autoheal_enabled: true

# Image tags for the optional sidecars (only used when exporters_enabled).
prometheus_node_exporter_image_tag: "latest"
prometheus_cadvisor_image_tag: "latest"

# Blackbox exporter sidecar — actively probes URLs over HTTP(S)/TCP/ICMP.
# Pairs with monitoring/dashboards/blackbox.json + monitoring/alerts/blackbox.yml.
# Targets are the consumer-aggregated probe URLs from every enabled bundle.
prometheus_blackbox_exporter_enabled: true
prometheus_blackbox_exporter_image: "prom/blackbox-exporter"
prometheus_blackbox_exporter_image_tag: "v0.28.0"
prometheus_blackbox_exporter_port: 9115
prometheus_blackbox_targets: []
prometheus_blackbox_scrape_interval: "60s"

# Scaleway TEM exporter sidecar — runs alongside prometheus when enabled,
# polls Scaleway's TEM API, exposes /metrics on port 9111 (internal only).
# Pairs with monitoring/dashboards/scaleway-tem.json + monitoring/alerts/scaleway-tem.yml.
prometheus_tem_exporter_enabled: false
prometheus_tem_exporter_image: "python"
prometheus_tem_exporter_image_tag: "3.12-alpine"
prometheus_tem_smtp_secret_id: ""
prometheus_tem_scaleway_project_id: ""
prometheus_tem_scaleway_region: "fr-par"
prometheus_tem_exporter_poll_interval: 60
prometheus_tem_exporter_lookback_minutes: 60
prometheus_tem_exporter_port: 9111
