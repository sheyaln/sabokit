---
broadsheet_hostname: ""

# Default deploy builds from source on the host (sabokit-broadsheet fork).
# Flip broadsheet_build_from_source=false to pull a published image.
broadsheet_image: "ghcr.io/sheyaln/sabokit-broadsheet"
broadsheet_image_tag: "latest"
broadsheet_build_from_source: true
broadsheet_image_source_repo: "https://github.com/sheyaln/sabokit-broadsheet.git"
broadsheet_image_source_ref: "main"

broadsheet_install_dir: "/opt/broadsheet"
broadsheet_data_dir: "/opt/broadsheet/data"
broadsheet_traefik_docker_network: "traefik"

# Ops-bundle opt-in labels.
broadsheet_auto_update_enabled: true
broadsheet_autoheal_enabled: true

broadsheet_timezone: "UTC"

broadsheet_app_secret_id: ""
broadsheet_db_credentials_secret_id: ""
broadsheet_smtp_secret_name: ""

broadsheet_memory_limit: "1G"
broadsheet_memory_reservation: "256M"
broadsheet_cpu_limit: "1.0"
broadsheet_cpu_reservation: "0.25"
