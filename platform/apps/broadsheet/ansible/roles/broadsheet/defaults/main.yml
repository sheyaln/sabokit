---
broadsheet_hostname: ""

# Default deploy pulls the published sabokit-broadsheet image. Flip
# broadsheet_build_from_source=true only for unreleased fork patches.
broadsheet_image: "ghcr.io/sheyaln/broadsheet"
broadsheet_image_tag: "latest"
broadsheet_build_from_source: false
broadsheet_image_source_repo: "https://github.com/sheyaln/sabokit-broadsheet.git"
broadsheet_image_source_ref: "main"

broadsheet_install_dir: "/opt/broadsheet"
broadsheet_data_dir: "/opt/broadsheet/data"
broadsheet_traefik_docker_network: "traefik"

# Ops-bundle opt-in labels.
broadsheet_auto_update_enabled: true
broadsheet_autoheal_enabled: true

broadsheet_timezone: "UTC"

broadsheet_app_secret_id: ""
broadsheet_db_credentials_secret_id: ""
broadsheet_smtp_secret_name: ""

broadsheet_memory_limit: "1G"
broadsheet_memory_reservation: "256M"
broadsheet_cpu_limit: "1.0"
broadsheet_cpu_reservation: "0.25"

# Filesystem owner/group for /opt/<slug>/ artifacts (compose file, .env).
# Defaults to the deploy user (ubuntu on stock cloud images) so the role
# doesn't leave the install dir root-owned. The deploy user is already in
# the docker group via the base/docker role and can therefore run
# `docker compose` against the rendered files without escalation.
broadsheet_file_owner: "ubuntu"
broadsheet_file_group: "ubuntu"
